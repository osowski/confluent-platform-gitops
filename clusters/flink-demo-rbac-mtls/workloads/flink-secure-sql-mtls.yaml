apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-secure-sql-mtls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "121"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/osowski/confluent-platform-gitops.git
    targetRevision: feature-384/flink-sql-mtls-live-verification
    path: workloads/flink-secure-sql-mtls/overlays/flink-demo-rbac-mtls
  destination:
    server: https://kubernetes.default.svc
    namespace: flink-secure-sql
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
