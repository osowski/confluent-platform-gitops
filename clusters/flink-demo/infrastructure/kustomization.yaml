apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- argocd-config.yaml
- infra-ingresses.yaml
- cert-manager.yaml
- cert-manager-resources.yaml
- trust-manager.yaml
- kube-prometheus-stack-crds.yaml
- kube-prometheus-stack.yaml
- metrics-server.yaml
- reflector.yaml
