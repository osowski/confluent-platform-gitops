---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: device-trust-mesh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "122"
spec:
  project: workloads
  source:
    repoURL: https://github.com/osowski/confluent-platform-gitops.git
    targetRevision: feature-449/dtm-a2a-router
    path: workloads/device-trust-mesh/overlays/flink-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: device-trust-mesh
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
