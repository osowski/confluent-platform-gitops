---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/osowski/confluent-platform-gitops.git
    targetRevision: fix-400/schema-registry-oauth-allowed-urls
    path: bootstrap
    helm:
      valuesObject:
        cluster:
          name: eks-demo
          domain: platform.dspdemos.com
        git:
          targetRevision: "fix-400/schema-registry-oauth-allowed-urls"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
