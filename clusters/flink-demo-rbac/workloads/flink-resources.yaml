apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "119" # After cmf-operator (118), before colors-and-shapes (120)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/osowski/confluent-platform-gitops.git
    targetRevision: feature-356/cmf-ui-sso-spike
    path: workloads/flink-resources/overlays/flink-demo-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
