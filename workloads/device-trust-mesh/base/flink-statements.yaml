---
# Flink SQL statements: long-running INSERT INTOs that maintain the
# device-trust-mesh context tables, derive risk signals and route device
# events to the agents as A2A requests.
#
# ---------------------------------------------------------------------------
# IMPORTANT: spec.statement is immutable once the statement is running
# ---------------------------------------------------------------------------
# The CRD carries a CEL validation rule:
#
#   rule:    self.statement == oldSelf.statement || oldSelf.statement == ''
#   message: statement is immutable once running
#
# Editing the SQL below and syncing FAILS PERMANENTLY - the API server rejects
# the update and retrying never helps. To change the SQL, add a new CR with a
# versioned name (`dtm-device-context-v2`) and remove the old one once it has
# drained. Neither `spec.stopped: true` nor
# `argocd.argoproj.io/sync-options: Force=true,Replace=true` is a way round
# it: the first does not unlock spec.statement, the second silently discards
# job state, including savepoints. See docs/architecture.md for the full set
# of Flink SQL CR constraints.
# ---------------------------------------------------------------------------
#
# dtm-device-context and dtm-customer-context fold device.events and
# device.policy-commands into the compacted device.context and
# customer.context upsert tables. Both are pure aggregates:
#
#   * LAST_VALUE follows arrival order, not event time, across the two input
#     topics; acceptable at demo rates. LAST_VALUE does not accept
#     TIMESTAMP_LTZ, so event times use MAX.
#   * device.context.context_seq is MAX(envelope.device_seq) over the device's
#     events: the watermark context readers compare against
#     required_context_seq.
#   * The required envelope fields are non-null by construction (taken from
#     the latest event, falling back to the latest command for a device that
#     has only commands), so no filter follows an aggregate. A filter there
#     makes the planner emit update-before rows, which the upsert sink writes
#     as tombstones ahead of every update.
#   * For the same reason dtm-customer-context INNER JOINs its event and
#     command aggregates, and seeds the command aggregate with one empty row
#     per event so it exists for every customer with events and never empties. A
#     LEFT JOIN, or a per-customer group that empties while a device's latest
#     action is retracted, emits a DELETE, which the sink writes as a
#     tombstone.
#   * recent_anomaly_count counts distinct non-ALLOW command message ids, so a
#     duplicate or re-produced command is counted once.
#
# Envelope message ids are DTM_ID: a UUIDv5-formatted SHA-1 over the record's
# content and the latest input message ids, so every event- or command-driven
# transition gets a new id, including a return to earlier content
# (TRUSTED -> CHALLENGED -> TRUSTED). The device id hashes the statement name,
# device_id, context_seq, trust_status, the latest event's message id and the
# latest command's message id. The customer id hashes the statement name,
# customer_id, the latest event's message id, the two command counts and the
# latest command's message id. Re-producing the same input records yields the
# same device ids; the customer id also depends on arrival order across a
# customer's devices.
#
# dtm-risk-signals appends one device.risk-signals row per detected anomaly,
# as one INSERT over a UNION ALL of four branches:
#
#   * COMPROMISED_OS (HIGH): fingerprint.rooted. OUTDATED_OS (MEDIUM): OS
#     major version below 17 on IOS or 13 on ANDROID. Both are per-event
#     filters; TRY_CAST makes an unparseable os_version raise no signal.
#   * NEW_DEVICE_ESTABLISHED_ACCOUNT (MEDIUM): an ENROL_REQUESTED with
#     account_age_days above 90 while at least one other device of the
#     customer has been ALLOWed. Events and ALLOW commands are unioned; an
#     inner OVER per device marks whether the device itself was allowed, an
#     outer OVER per customer counts distinct allowed devices (Flink allows
#     one window spec per SELECT). A device blocked after its ALLOW still
#     counts.
#   * IMPOSSIBLE_TRAVEL (HIGH): LAG over the customer's events; haversine
#     distance above 900 km/h of elapsed envelope.event_time. The previous
#     event must exist and elapsed time must be at least 1 s
#     (TIMESTAMPDIFF(SECOND) truncates), so a re-produced older event raises
#     nothing.
#   * OVER clauses order by processing time (proc_time on device.events,
#     PROCTIME() on device.policy-commands). "Previously" means processed
#     earlier, so a replay, backfill or re-read from earliest-offset can
#     interleave events and commands differently from the live run, and so
#     omit, or newly add, NEW_DEVICE_ESTABLISHED_ACCOUNT and
#     IMPOSSIBLE_TRAVEL signals.
#   * OVER state expires with table.exec.state.ttl (7 d of no input per
#     partition). NEW_DEVICE_ESTABLISHED_ACCOUNT only remembers ALLOWs inside
#     that window, and the per-device and per-customer states expire
#     independently, so a device's own re-enrolment after expiry can be
#     miscounted. IMPOSSIBLE_TRAVEL has no previous event after 7 idle days
#     for the customer.
#   * signal_id (also envelope.message_id) is DTM_ID over the statement name,
#     signal_type and the causing event's message id, so it is deterministic
#     per (signal_type, causing event) and a duplicate dedupes on signal_id.
#     The envelope copies the event's correlation, event_time, device,
#     customer, device_seq, mode and replay_run_id fields, so every required
#     field is non-null by construction.
#   * detail literals are ASCII: non-ASCII literals reach the job mangled.
#
# dtm-a2a-task-router turns device.events into A2A v1.0 SendMessage JSON-RPC
# requests, as one EXECUTE STATEMENT SET with one INSERT per raw sink:
#
#   * ENROL_REQUESTED -> agent.tasks.risk, AssessEnrolmentRequest. The
#     payload requires customerId and requiredContextSeq, so an event without
#     customer_id or device_seq is not routed.
#   * UNENROL_REQUESTED -> agent.tasks.enrolment, DecideEnrolmentRequest
#     REMOVE_TRUST.
#   * CHALLENGE_PASSED / CHALLENGE_FAILED with a non-empty enrolment_task_id
#     -> agent.tasks.enrolment, RESOLVE_CHALLENGE; message.taskId is the
#     enrolment_task_id, so the agent resumes that task. Without one the event
#     is not routed.
#   * messageId (also the JSON-RPC id and envelope messageId) is DTM_ID over
#     the literal 'dtm-a2a-task-router', the source topic and the event's Kafka
#     partition and offset. A -v2 must keep that literal, or it re-sends every
#     historical request under new ids. A re-read from earliest-offset reproduces the same ids, so agents
#     dedupe on messageId; a re-produced event has a new offset and so a new id.
#   * contextId and the envelope correlationId are the event's correlation_id;
#     causationId is its message_id. requiredContextSeq (envelope and risk
#     payload) is the event's device_seq: the device.context context_seq an
#     agent waits for before reading context.
#   * eventTime is the event's event_time in epoch millis. A TIMESTAMP_LTZ
#     cannot be CAST to a number, and TIMESTAMPDIFF returns INT, so whole
#     minutes since the epoch are widened to BIGINT before the seconds and
#     millis are added.
#   * Optional JSON members are absent, never null: every JSON_OBJECT that can
#     hold a null member carries ABSENT ON NULL itself (the clause does not
#     reach nested objects). The nested JSON_OBJECT and JSON_ARRAY calls are
#     inline, so they serialise as JSON rather than as strings.
#   * The record key is the device_id. Headers: a2a-correlation-id,
#     a2a-message-id, a2a-reply-topic (agent.task-events), dtm-agent-id and
#     dtm-mode. Map keys are CAST to STRING so CHAR literals are not padded.
#
# SQL targets Flink 1.19 (cp-flink-sql:1.19-cp10).

apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-device-context
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  flinkConfiguration:
    table.exec.state.ttl: "7 d"
    table.exec.sink.not-null-enforcer: "DROP"
  statement: >-
    INSERT INTO `device.context`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`device_id`, `envelope`, `customer_id`, `context_seq`, `trust_status`,
    `platform`, `os_version`, `rooted`, `last_country`, `last_lat`, `last_lon`,
    `last_event_type`, `last_event_time`)
    SELECT
    `device_id`,
    ROW(
    CONCAT(SUBSTR(`h`, 1, 8), '-', SUBSTR(`h`, 9, 4), '-5', SUBSTR(`h`, 14, 3), '-8', SUBSTR(`h`, 18, 3), '-', SUBSTR(`h`, 21, 12)),
    `env_correlation_id`, `env_causation_id`,
    CAST('flink:dtm-device-context' AS STRING), CAST('dtm-device-context' AS STRING), CAST('n/a' AS STRING),
    `env_event_time`, `device_id`, `customer_id`, `context_seq`, CAST(NULL AS BIGINT), `env_mode`, `env_replay_run_id`
    ),
    `customer_id`, `context_seq`,
    `trust_status`,
    `platform`, `os_version`, `rooted`, `last_country`, `last_lat`, `last_lon`,
    `last_event_type`, `last_event_time`
    FROM (
    SELECT *,
    SHA1(CONCAT_WS('|', 'dtm-device-context', `device_id`, CAST(`context_seq` AS STRING), `trust_status`,
    `env_causation_id`, `latest_command_id`)) AS `h`
    FROM (
    SELECT *,
    COALESCE(`command_status`, CASE WHEN `enrol_requests` > 0 THEN CAST('PENDING' AS STRING) ELSE CAST('UNKNOWN' AS STRING) END) AS `trust_status`
    FROM (
    SELECT
    `device_id`,
    LAST_VALUE(`customer_id`) AS `customer_id`,
    MAX(`device_seq`) AS `context_seq`,
    LAST_VALUE(CASE
    WHEN `action` = 'ALLOW' THEN CAST('TRUSTED' AS STRING)
    WHEN `action` = 'READ_ONLY' THEN CAST('READ_ONLY' AS STRING)
    WHEN `action` = 'CHALLENGE' THEN CAST('CHALLENGED' AS STRING)
    WHEN `action` = 'BLOCK' AND `reason` = 'UNENROLLED' THEN CAST('UNENROLLED' AS STRING)
    WHEN `action` = 'BLOCK' THEN CAST('BLOCKED' AS STRING)
    END) AS `command_status`,
    SUM(CASE WHEN `event_type` = 'ENROL_REQUESTED' THEN 1 ELSE 0 END) AS `enrol_requests`,
    LAST_VALUE(`platform`) AS `platform`,
    LAST_VALUE(`os_version`) AS `os_version`,
    LAST_VALUE(`rooted`) AS `rooted`,
    LAST_VALUE(`country`) AS `last_country`,
    LAST_VALUE(`lat`) AS `last_lat`,
    LAST_VALUE(`lon`) AS `last_lon`,
    LAST_VALUE(`event_type`) AS `last_event_type`,
    MAX(CASE WHEN `src` = 'event' THEN `event_time` END) AS `last_event_time`,
    COALESCE(MAX(CASE WHEN `src` = 'event' THEN `event_time` END), MAX(`event_time`)) AS `env_event_time`,
    COALESCE(LAST_VALUE(CASE WHEN `src` = 'event' THEN `message_id` END), LAST_VALUE(`message_id`)) AS `env_causation_id`,
    COALESCE(LAST_VALUE(CASE WHEN `src` = 'event' THEN `correlation_id` END), LAST_VALUE(`correlation_id`)) AS `env_correlation_id`,
    COALESCE(LAST_VALUE(CASE WHEN `src` = 'event' THEN `mode` END), LAST_VALUE(`mode`)) AS `env_mode`,
    NULLIF(LAST_VALUE(CASE WHEN `src` = 'event' THEN COALESCE(`replay_run_id`, '') END), '') AS `env_replay_run_id`,
    LAST_VALUE(CASE WHEN `src` = 'command' THEN `message_id` END) AS `latest_command_id`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    CAST('event' AS STRING) AS `src`,
    `envelope`.`device_seq` AS `device_seq`,
    `event_type`,
    `fingerprint`.`platform` AS `platform`,
    `fingerprint`.`os_version` AS `os_version`,
    `fingerprint`.`rooted` AS `rooted`,
    `geo`.`country` AS `country`,
    `geo`.`lat` AS `lat`,
    `geo`.`lon` AS `lon`,
    CAST(NULL AS STRING) AS `action`,
    CAST(NULL AS STRING) AS `reason`,
    `envelope`.`event_time` AS `event_time`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-device-context', 'scan.startup.mode' = 'earliest-offset') */
    UNION ALL
    SELECT
    `envelope`.`device_id`,
    `envelope`.`customer_id`,
    CAST('command' AS STRING),
    CAST(NULL AS BIGINT),
    CAST(NULL AS STRING),
    CAST(NULL AS STRING),
    CAST(NULL AS STRING),
    CAST(NULL AS BOOLEAN),
    CAST(NULL AS STRING),
    CAST(NULL AS DOUBLE),
    CAST(NULL AS DOUBLE),
    `action`,
    `reason`,
    `envelope`.`event_time`,
    `envelope`.`message_id`,
    `envelope`.`correlation_id`,
    `envelope`.`mode`,
    `envelope`.`replay_run_id`
    FROM `device.policy-commands`
    /*+ OPTIONS('properties.group.id' = 'dtm-device-context', 'scan.startup.mode' = 'earliest-offset') */
    )
    GROUP BY `device_id`
    )
    )
    )
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-customer-context
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  flinkConfiguration:
    table.exec.state.ttl: "7 d"
    table.exec.sink.not-null-enforcer: "DROP"
  statement: >-
    INSERT INTO `customer.context`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`customer_id`, `envelope`, `device_count`, `trusted_device_count`, `known_countries`,
    `recent_anomaly_count`, `account_age_days`, `last_country`, `last_event_time`)
    SELECT
    `customer_id`,
    ROW(
    CONCAT(SUBSTR(`h`, 1, 8), '-', SUBSTR(`h`, 9, 4), '-5', SUBSTR(`h`, 14, 3), '-8', SUBSTR(`h`, 18, 3), '-', SUBSTR(`h`, 21, 12)),
    `env_correlation_id`, `env_causation_id`,
    CAST('flink:dtm-customer-context' AS STRING), CAST('dtm-customer-context' AS STRING), CAST('n/a' AS STRING),
    `last_event_time`, `env_device_id`, `customer_id`, `env_device_seq`, CAST(NULL AS BIGINT),
    `env_mode`, `env_replay_run_id`
    ),
    `device_count`, `trusted_device_count`, `known_countries`, `recent_anomaly_count`,
    `account_age_days`, `last_country`, `last_event_time`
    FROM (
    SELECT *,
    SHA1(CONCAT_WS('|', 'dtm-customer-context', `customer_id`, `env_causation_id`,
    CAST(`trusted_device_count` AS STRING), CAST(`recent_anomaly_count` AS STRING),
    `latest_command_id`)) AS `h`
    FROM (
    SELECT
    `ev`.*,
    `cmd`.`trusted_device_count`,
    `cmd`.`recent_anomaly_count`,
    `cmd`.`latest_command_id`
    FROM (
    SELECT
    `customer_id`,
    CAST(COUNT(DISTINCT `device_id`) AS INT) AS `device_count`,
    LISTAGG(DISTINCT `country`) AS `known_countries`,
    LAST_VALUE(`account_age_days`) AS `account_age_days`,
    LAST_VALUE(`country`) AS `last_country`,
    MAX(`event_time`) AS `last_event_time`,
    LAST_VALUE(`message_id`) AS `env_causation_id`,
    LAST_VALUE(`correlation_id`) AS `env_correlation_id`,
    LAST_VALUE(`device_id`) AS `env_device_id`,
    NULLIF(LAST_VALUE(COALESCE(`device_seq`, -1)), -1) AS `env_device_seq`,
    LAST_VALUE(`mode`) AS `env_mode`,
    NULLIF(LAST_VALUE(COALESCE(`replay_run_id`, '')), '') AS `env_replay_run_id`
    FROM (
    SELECT
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`event_time` AS `event_time`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    `geo`.`country` AS `country`,
    `account_age_days`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-customer-context', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    )
    GROUP BY `customer_id`
    ) AS `ev`
    JOIN (
    SELECT
    `customer_id`,
    CAST(SUM(CASE WHEN `latest_action` = 'ALLOW' THEN 1 ELSE 0 END) AS INT) AS `trusted_device_count`,
    CAST(COUNT(DISTINCT CASE WHEN `action` <> 'ALLOW' THEN `message_id` END) AS INT) AS `recent_anomaly_count`,
    LAST_VALUE(`message_id`) AS `latest_command_id`
    FROM (
    SELECT
    `envelope`.`customer_id` AS `customer_id`,
    CAST(NULL AS STRING) AS `latest_action`,
    CAST(NULL AS STRING) AS `action`,
    CAST(NULL AS STRING) AS `message_id`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-customer-context', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    UNION ALL
    SELECT
    `envelope`.`customer_id`,
    CAST(NULL AS STRING),
    `action`,
    `envelope`.`message_id`
    FROM `device.policy-commands`
    /*+ OPTIONS('properties.group.id' = 'dtm-customer-context', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    UNION ALL
    SELECT
    `customer_id`,
    LAST_VALUE(`action`),
    CAST(NULL AS STRING),
    CAST(NULL AS STRING)
    FROM (
    SELECT
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`device_id` AS `device_id`,
    `action`
    FROM `device.policy-commands`
    /*+ OPTIONS('properties.group.id' = 'dtm-customer-context', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    )
    GROUP BY `customer_id`, `device_id`
    )
    GROUP BY `customer_id`
    ) AS `cmd`
    ON `ev`.`customer_id` = `cmd`.`customer_id`
    )
    )
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-risk-signals
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  flinkConfiguration:
    table.exec.state.ttl: "7 d"
    table.exec.sink.not-null-enforcer: "DROP"
  statement: >-
    INSERT INTO `device.risk-signals`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`key`, `envelope`, `signal_id`, `signal_type`, `severity`, `detail`, `source_event_type`)
    SELECT
    CAST(`device_id` AS BYTES),
    ROW(
    `signal_id`, `correlation_id`, `message_id`,
    CAST('flink:dtm-risk-signals' AS STRING), CAST('dtm-risk-signals' AS STRING), CAST('n/a' AS STRING),
    `event_time`, `device_id`, `customer_id`, `device_seq`, CAST(NULL AS BIGINT), `mode`, `replay_run_id`
    ),
    `signal_id`, `signal_type`, `severity`, `detail`, `source_event_type`
    FROM (
    SELECT *,
    CONCAT(SUBSTR(`h`, 1, 8), '-', SUBSTR(`h`, 9, 4), '-5', SUBSTR(`h`, 14, 3), '-8', SUBSTR(`h`, 18, 3), '-', SUBSTR(`h`, 21, 12)) AS `signal_id`
    FROM (
    SELECT *,
    SHA1(CONCAT_WS('|', 'dtm-risk-signals', `signal_type`, `message_id`)) AS `h`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`event_time` AS `event_time`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    CAST('COMPROMISED_OS' AS STRING) AS `signal_type`,
    CAST('HIGH' AS STRING) AS `severity`,
    CONCAT(`fingerprint`.`platform`, ' ', `fingerprint`.`os_version`, ' rooted') AS `detail`,
    `event_type` AS `source_event_type`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-risk-signals', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `fingerprint`.`rooted` = TRUE
    UNION ALL
    SELECT
    `envelope`.`device_id`,
    `envelope`.`customer_id`,
    `envelope`.`message_id`,
    `envelope`.`correlation_id`,
    `envelope`.`event_time`,
    `envelope`.`device_seq`,
    `envelope`.`mode`,
    `envelope`.`replay_run_id`,
    CAST('OUTDATED_OS' AS STRING),
    CAST('MEDIUM' AS STRING),
    CONCAT(`fingerprint`.`platform`, ' ', `fingerprint`.`os_version`, ' below minimum ',
    CASE WHEN `fingerprint`.`platform` = 'IOS' THEN CAST('17' AS STRING) ELSE CAST('13' AS STRING) END),
    `event_type`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-risk-signals', 'scan.startup.mode' = 'earliest-offset') */
    WHERE (`fingerprint`.`platform` = 'IOS' AND TRY_CAST(SPLIT_INDEX(`fingerprint`.`os_version`, '.', 0) AS INT) < 17)
    OR (`fingerprint`.`platform` = 'ANDROID' AND TRY_CAST(SPLIT_INDEX(`fingerprint`.`os_version`, '.', 0) AS INT) < 13)
    UNION ALL
    SELECT
    `device_id`, `customer_id`, `message_id`, `correlation_id`, `event_time`, `device_seq`, `mode`, `replay_run_id`,
    CAST('NEW_DEVICE_ESTABLISHED_ACCOUNT' AS STRING),
    CAST('MEDIUM' AS STRING),
    CONCAT('account ', CAST(`account_age_days` AS STRING), ' days old, ',
    CAST(`allowed` - `self_allowed` AS STRING), ' other device(s) allowed'),
    `event_type`
    FROM (
    SELECT *,
    COUNT(DISTINCT CASE WHEN `src` = 'cmd' THEN `device_id` END) OVER (
    PARTITION BY `customer_id` ORDER BY `proc_time` ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS `allowed`
    FROM (
    SELECT *,
    MAX(CASE WHEN `src` = 'cmd' THEN 1 ELSE 0 END) OVER (
    PARTITION BY `device_id` ORDER BY `proc_time` ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS `self_allowed`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    CAST('event' AS STRING) AS `src`,
    `event_type`,
    `account_age_days`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`event_time` AS `event_time`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    `proc_time`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-risk-signals', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    UNION ALL
    SELECT
    `envelope`.`device_id`,
    `envelope`.`customer_id`,
    CAST('cmd' AS STRING),
    CAST(NULL AS STRING),
    CAST(NULL AS INT),
    `envelope`.`message_id`,
    `envelope`.`correlation_id`,
    `envelope`.`event_time`,
    `envelope`.`device_seq`,
    `envelope`.`mode`,
    `envelope`.`replay_run_id`,
    PROCTIME()
    FROM `device.policy-commands`
    /*+ OPTIONS('properties.group.id' = 'dtm-risk-signals', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `action` = 'ALLOW' AND `envelope`.`customer_id` IS NOT NULL
    )
    )
    )
    WHERE `src` = 'event' AND `event_type` = 'ENROL_REQUESTED' AND `account_age_days` > 90
    AND `allowed` - `self_allowed` >= 1
    UNION ALL
    SELECT
    `device_id`, `customer_id`, `message_id`, `correlation_id`, `event_time`, `device_seq`, `mode`, `replay_run_id`,
    CAST('IMPOSSIBLE_TRAVEL' AS STRING),
    CAST('HIGH' AS STRING),
    CONCAT(`prev_country`, '->', `country`, ' ', CAST(CAST(ROUND(`km`, 0) AS BIGINT) AS STRING), ' km in ',
    CAST(ROUND(CAST(`elapsed_s` AS DOUBLE) / 3600, 1) AS STRING), ' h'),
    `event_type`
    FROM (
    SELECT *,
    6371 * 2 * ASIN(SQRT(POWER(SIN(RADIANS(`lat` - `prev_lat`) / 2), 2)
    + COS(RADIANS(`prev_lat`)) * COS(RADIANS(`lat`)) * POWER(SIN(RADIANS(`lon` - `prev_lon`) / 2), 2))) AS `km`,
    TIMESTAMPDIFF(SECOND, `prev_event_time`, `event_time`) AS `elapsed_s`
    FROM (
    SELECT *,
    LAG(`lat`) OVER (PARTITION BY `customer_id` ORDER BY `proc_time`) AS `prev_lat`,
    LAG(`lon`) OVER (PARTITION BY `customer_id` ORDER BY `proc_time`) AS `prev_lon`,
    LAG(`country`) OVER (PARTITION BY `customer_id` ORDER BY `proc_time`) AS `prev_country`,
    LAG(`event_time`) OVER (PARTITION BY `customer_id` ORDER BY `proc_time`) AS `prev_event_time`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`event_time` AS `event_time`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    `event_type`,
    `geo`.`country` AS `country`,
    `geo`.`lat` AS `lat`,
    `geo`.`lon` AS `lon`,
    `proc_time`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-risk-signals', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `envelope`.`customer_id` IS NOT NULL
    )
    )
    )
    WHERE `prev_lat` IS NOT NULL AND `elapsed_s` > 0 AND `km` > 900 * CAST(`elapsed_s` AS DOUBLE) / 3600
    )
    )
    )
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-a2a-task-router
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  flinkConfiguration:
    table.exec.state.ttl: "7 d"
    table.exec.sink.not-null-enforcer: "DROP"
  statement: >-
    EXECUTE STATEMENT SET
    BEGIN
    INSERT INTO `agent.tasks.risk`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`key`, `val`, `headers`)
    SELECT
    CAST(`device_id` AS BYTES),
    CAST(JSON_OBJECT(
    'jsonrpc' VALUE '2.0',
    'id' VALUE `msg_id`,
    'method' VALUE 'SendMessage',
    'params' VALUE JSON_OBJECT('message' VALUE JSON_OBJECT(
    'messageId' VALUE `msg_id`,
    'contextId' VALUE `correlation_id`,
    'role' VALUE 'ROLE_USER',
    'extensions' VALUE JSON_ARRAY('urn:device-trust-mesh:envelope:v1'),
    'metadata' VALUE JSON_OBJECT('urn:device-trust-mesh:envelope:v1' VALUE JSON_OBJECT(
    'messageId' VALUE `msg_id`,
    'correlationId' VALUE `correlation_id`,
    'causationId' VALUE `message_id`,
    'agentId' VALUE 'flink:dtm-a2a-task-router',
    'agentVersion' VALUE 'dtm-a2a-task-router',
    'configVersion' VALUE 'n/a',
    'eventTime' VALUE `event_time_ms`,
    'deviceId' VALUE `device_id`,
    'customerId' VALUE `customer_id`,
    'deviceSeq' VALUE `device_seq`,
    'requiredContextSeq' VALUE `device_seq`,
    'mode' VALUE `mode`,
    'replayRunId' VALUE `replay_run_id`
    ABSENT ON NULL) ABSENT ON NULL),
    'parts' VALUE JSON_ARRAY(
    JSON_OBJECT('data' VALUE JSON_OBJECT(
    'deviceId' VALUE `device_id`,
    'customerId' VALUE `customer_id`,
    'requiredContextSeq' VALUE `device_seq`,
    'fingerprintSummary' VALUE `fingerprint_summary`
    ABSENT ON NULL), 'mediaType' VALUE 'application/json' ABSENT ON NULL),
    JSON_OBJECT('text' VALUE CONCAT('Assess enrolment risk for ', `device_id`, ' (customer ', `customer_id`, ')') ABSENT ON NULL)
    ABSENT ON NULL)
    ABSENT ON NULL) ABSENT ON NULL)
    ABSENT ON NULL) AS BYTES),
    MAP[
    CAST('a2a-correlation-id' AS STRING), CAST(`correlation_id` AS BYTES),
    CAST('a2a-message-id' AS STRING), CAST(`msg_id` AS BYTES),
    CAST('a2a-reply-topic' AS STRING), CAST('agent.task-events' AS BYTES),
    CAST('dtm-agent-id' AS STRING), CAST('flink:dtm-a2a-task-router' AS BYTES),
    CAST('dtm-mode' AS STRING), CAST(`mode` AS BYTES)
    ]
    FROM (
    SELECT *,
    CONCAT(SUBSTR(`h`, 1, 8), '-', SUBSTR(`h`, 9, 4), '-5', SUBSTR(`h`, 14, 3), '-8', SUBSTR(`h`, 18, 3), '-', SUBSTR(`h`, 21, 12)) AS `msg_id`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    CAST(TIMESTAMPDIFF(MINUTE, TO_TIMESTAMP_LTZ(0, 3), `envelope`.`event_time`) AS BIGINT) * 60000
    + EXTRACT(SECOND FROM `envelope`.`event_time`) * 1000 + EXTRACT(MILLISECOND FROM `envelope`.`event_time`) AS `event_time_ms`,
    CONCAT(`fingerprint`.`platform`, ' ', `fingerprint`.`os_version`, ', rooted=', LOWER(CAST(`fingerprint`.`rooted` AS STRING)),
    ', network=', `fingerprint`.`network_type`, ', country=', `geo`.`country`) AS `fingerprint_summary`,
    SHA1(CONCAT_WS('|', 'dtm-a2a-task-router', 'device.events', CAST(`kafka_partition` AS STRING), CAST(`kafka_offset` AS STRING))) AS `h`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-a2a-task-router', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `event_type` = 'ENROL_REQUESTED' AND `envelope`.`customer_id` IS NOT NULL AND `envelope`.`device_seq` IS NOT NULL
    )
    );
    INSERT INTO `agent.tasks.enrolment`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`key`, `val`, `headers`)
    SELECT
    CAST(`device_id` AS BYTES),
    CAST(JSON_OBJECT(
    'jsonrpc' VALUE '2.0',
    'id' VALUE `msg_id`,
    'method' VALUE 'SendMessage',
    'params' VALUE JSON_OBJECT('message' VALUE JSON_OBJECT(
    'messageId' VALUE `msg_id`,
    'contextId' VALUE `correlation_id`,
    'taskId' VALUE `task_id`,
    'role' VALUE 'ROLE_USER',
    'extensions' VALUE JSON_ARRAY('urn:device-trust-mesh:envelope:v1'),
    'metadata' VALUE JSON_OBJECT('urn:device-trust-mesh:envelope:v1' VALUE JSON_OBJECT(
    'messageId' VALUE `msg_id`,
    'correlationId' VALUE `correlation_id`,
    'causationId' VALUE `message_id`,
    'agentId' VALUE 'flink:dtm-a2a-task-router',
    'agentVersion' VALUE 'dtm-a2a-task-router',
    'configVersion' VALUE 'n/a',
    'eventTime' VALUE `event_time_ms`,
    'deviceId' VALUE `device_id`,
    'customerId' VALUE `customer_id`,
    'deviceSeq' VALUE `device_seq`,
    'requiredContextSeq' VALUE `device_seq`,
    'mode' VALUE `mode`,
    'replayRunId' VALUE `replay_run_id`
    ABSENT ON NULL) ABSENT ON NULL),
    'parts' VALUE JSON_ARRAY(
    JSON_OBJECT('data' VALUE JSON_OBJECT(
    'taskType' VALUE `task_type`,
    'deviceId' VALUE `device_id`,
    'customerId' VALUE `customer_id`,
    'enrolmentTaskId' VALUE `task_id`,
    'challengeResult' VALUE `challenge_result`
    ABSENT ON NULL), 'mediaType' VALUE 'application/json' ABSENT ON NULL),
    JSON_OBJECT('text' VALUE `summary` ABSENT ON NULL)
    ABSENT ON NULL)
    ABSENT ON NULL) ABSENT ON NULL)
    ABSENT ON NULL) AS BYTES),
    MAP[
    CAST('a2a-correlation-id' AS STRING), CAST(`correlation_id` AS BYTES),
    CAST('a2a-message-id' AS STRING), CAST(`msg_id` AS BYTES),
    CAST('a2a-reply-topic' AS STRING), CAST('agent.task-events' AS BYTES),
    CAST('dtm-agent-id' AS STRING), CAST('flink:dtm-a2a-task-router' AS BYTES),
    CAST('dtm-mode' AS STRING), CAST(`mode` AS BYTES)
    ]
    FROM (
    SELECT *,
    CONCAT(SUBSTR(`h`, 1, 8), '-', SUBSTR(`h`, 9, 4), '-5', SUBSTR(`h`, 14, 3), '-8', SUBSTR(`h`, 18, 3), '-', SUBSTR(`h`, 21, 12)) AS `msg_id`,
    CASE WHEN `challenge_result` IS NULL THEN CONCAT('Remove trust for ', `device_id`)
    ELSE CONCAT('Resolve challenge ', `challenge_result`, ' for ', `device_id`, ' (enrolment task ', `task_id`, ')') END AS `summary`
    FROM (
    SELECT
    `envelope`.`device_id` AS `device_id`,
    `envelope`.`customer_id` AS `customer_id`,
    `envelope`.`message_id` AS `message_id`,
    `envelope`.`correlation_id` AS `correlation_id`,
    `envelope`.`device_seq` AS `device_seq`,
    `envelope`.`mode` AS `mode`,
    `envelope`.`replay_run_id` AS `replay_run_id`,
    CAST(TIMESTAMPDIFF(MINUTE, TO_TIMESTAMP_LTZ(0, 3), `envelope`.`event_time`) AS BIGINT) * 60000
    + EXTRACT(SECOND FROM `envelope`.`event_time`) * 1000 + EXTRACT(MILLISECOND FROM `envelope`.`event_time`) AS `event_time_ms`,
    CASE WHEN `event_type` = 'UNENROL_REQUESTED' THEN CAST('REMOVE_TRUST' AS STRING) ELSE CAST('RESOLVE_CHALLENGE' AS STRING) END AS `task_type`,
    CASE WHEN `event_type` = 'UNENROL_REQUESTED' THEN CAST(NULL AS STRING) ELSE `enrolment_task_id` END AS `task_id`,
    CASE WHEN `event_type` = 'CHALLENGE_PASSED' THEN CAST('PASSED' AS STRING)
    WHEN `event_type` = 'CHALLENGE_FAILED' THEN CAST('FAILED' AS STRING) END AS `challenge_result`,
    SHA1(CONCAT_WS('|', 'dtm-a2a-task-router', 'device.events', CAST(`kafka_partition` AS STRING), CAST(`kafka_offset` AS STRING))) AS `h`
    FROM `device.events`
    /*+ OPTIONS('properties.group.id' = 'dtm-a2a-task-router', 'scan.startup.mode' = 'earliest-offset') */
    WHERE `event_type` = 'UNENROL_REQUESTED'
    OR (`event_type` IN ('CHALLENGE_PASSED', 'CHALLENGE_FAILED') AND `enrolment_task_id` IS NOT NULL AND `enrolment_task_id` <> '')
    )
    );
    END;
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
