# KafkaTopic resources for the Agentic Device Trust Mesh.
#
# Topic names contain dots and underscores, which Kubernetes object names do
# not allow, so metadata.name is a DNS-safe alias and spec.name carries the
# real topic name.
#
# Partitions: 6 per topic (supports DEVICE_CAP up to 500; partition counts
# cannot shrink, so they are not derived from the cap). agent.cards,
# agent.cards_human_readable and simulator.control use 1.
#
# 7-day retention on the replay-relevant inputs defines the replay window;
# the compacted context topics are the durable store behind context-mcp.
---
# Business-data plane. Agents never consume these; they read business
# state only through the context-mcp FastMCP tools.
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: device-events
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  name: device.events
  replicas: 3
  partitionCount: 6
  configs:
    cleanup.policy: "delete"
    retention.ms: "604800000"  # 7 days
  kafkaRestClassRef:
    name: default
    namespace: kafka
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
