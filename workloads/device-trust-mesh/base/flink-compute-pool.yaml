---
# Shared Flink SQL compute pool (CFK 3.3.0+, RFC 68)
#
# type: SHARED runs one long-lived Flink session cluster that executes every
# device-trust-mesh statement, instead of one application-mode cluster per
# statement. Shared pools keep statement state across stop/resume only on
# CMF >= 2.4.2.
#
# spec.type is immutable once created. Pool updates are rejected while any
# statement on the pool is PENDING, RUNNING, STOPPED or FAILING; stop or
# delete the statements first, or add a new pool.
#
# Sizing: one 12-slot TaskManager covers the ten long-running statements at
# parallelism 1, with two slots spare.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkComputePool
metadata:
  name: dtm-shared-pool
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  type: SHARED
  state: RUNNING
  flinkEnvironment: dtm-env
  clusterSpec:
    flinkVersion: v2_3
    image: confluentinc/cp-flink-sql:2.3-cmf2.5-cp1
    # JVM options: a patch value replaces the whole string, so each component
    # sets its flags on env.java.opts.jobmanager and env.java.opts.taskmanager
    # rather than env.java.opts.all (components/rbac-oauth sets both for the
    # OAuth allow-list). Flink appends them to env.java.opts.all. A second
    # component that needs the same key must carry the existing flags into
    # its value.
    flinkConfiguration:
      taskmanager.numberOfTaskSlots: "12"
      metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
      metrics.reporter.prom.port: "9249-9250"
      # Chaining keeps each Kafka sink's writer and committer in one task, so
      # a committed transactional producer goes back to the writer's pool.
      # Unchained, the writer opens a new producer on every checkpoint and
      # never closes the old ones, and the TaskManager runs out of memory.
      pipeline.operator-chaining.enabled: "true"
      execution.checkpointing.interval: "10s"
      execution.checkpointing.dir: "s3://warehouse/checkpoints/device-trust-mesh/"
      execution.checkpointing.savepoint-dir: "s3://warehouse/savepoints/device-trust-mesh/"
      s3.endpoint: "http://rustfs.storage.svc.cluster.local:9000"
      s3.path.style.access: "true"
      s3.connection.ssl.enabled: "false"
      state.backend.type: "hashmap"
      execution.checkpointing.timeout: "600000"
      execution.checkpointing.min-pause: "5000"
      execution.checkpointing.max-concurrent-checkpoints: "1"
      high-availability.type: "kubernetes"
      high-availability.storageDir: "s3://warehouse/ha/device-trust-mesh/"
      execution.checkpointing.num-retained: "10"
    podTemplate:
      spec:
        restartPolicy: Always
        terminationGracePeriodSeconds: 30
        containers:
          - name: flink-main-container
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 9999
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: access-key
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: secret-key
    taskManager:
      resource:
        cpu: 3.0
        memory: "4608m"
    jobManager:
      resource:
        cpu: 1
        memory: "1024m"
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
