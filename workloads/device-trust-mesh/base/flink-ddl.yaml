# Flink table DDL: typed columns on the inferred device-trust-mesh tables.
#
# The dtm-catalog infers every table from its topic and Schema Registry
# subjects. Avro topics get typed columns; the A2A topics have no <topic>-value
# subject (see schemas.yaml), so they infer as raw `key`/`val` VARBINARY.
# Each statement here is one ALTER TABLE ... ADD that layers columns on top:
#
#   * device.events: Kafka partition/offset metadata and a processing-time
#     attribute for OVER/LAG ordering.
#   * agent.tasks.*: the Kafka headers plus JSON_VALUE/JSON_QUERY columns over
#     the JSON-RPC SendMessage request, including the 13 envelope fields from
#     metadata['urn:device-trust-mesh:envelope:v1']. The four statements are
#     identical apart from the table name.
#   * agent.task-events: the reply kind, task/status/artifact columns and the
#     envelope, each COALESCEd over the task, statusUpdate and artifactUpdate
#     shapes.
#   * agent.cards: Agent Card name, version, skills and interface.
#
# parts[0] is the typed data part and parts[1] the text summary; the columns
# rely on that order.
#
# BIGINT columns use TRY_CAST(JSON_VALUE(...) AS BIGINT): Flink 1.19 rejects
# JSON_VALUE ... RETURNING BIGINT only when a query first reads the column,
# so the ALTER itself would still complete. Text that is not a plain number
# becomes NULL (an ISO timestamp, or a float that JSON_VALUE renders as
# 1.79332393777E12) instead of failing the job: the views drop a record
# whose env_event_time is NULL and pass a NULL sequence through. Plain
# decimal text such as 3.7 truncates to 3.
#
# ---------------------------------------------------------------------------
# IMPORTANT: each DDL runs once
# ---------------------------------------------------------------------------
# A DDL statement completes (phase COMPLETED) and its CR stays as the record.
# spec.statement is immutable, and re-creating a CR against a table that
# already has these columns fails, because ALTER TABLE ... ADD rejects
# existing columns. Ship any table change as a new versioned CR
# (`dtm-ddl-agent-task-events-v2`) whose ALTER adds, drops or modifies only the
# delta. Deleting a CR does not undo its ALTER; the columns live in the
# catalog until the topic is deleted.
#
# Recovering a deleted CR: when a dtm-ddl-* CR is deleted (including by
# `kubectl delete flinkstatement --all`), Argo CD re-creates it and it FAILS
# because its columns already exist. To recover:
#   1. Stop or delete the statements that read the table.
#   2. Run ALTER TABLE `<table>` DROP (<every column the CR adds>) as a
#      one-off statement through CMF (UI or REST).
#   3. Sync the device-trust-mesh Application so the CR runs again.
# ---------------------------------------------------------------------------
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-ddl-device-events
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  statement: >-
    ALTER TABLE `device.events` ADD (
    `kafka_partition` INT METADATA FROM 'partition' VIRTUAL,
    `kafka_offset` BIGINT METADATA FROM 'offset' VIRTUAL,
    `proc_time` AS PROCTIME()
    )
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-ddl-agent-tasks-risk
  namespace: device-trust-mesh
  annotations:
