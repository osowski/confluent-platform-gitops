spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  statement: >-
    ALTER TABLE `agent.tasks.risk` ADD (
    `headers` MAP<STRING, BYTES> METADATA,
    `rpc_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.id'),
    `rpc_method` AS JSON_VALUE(CAST(`val` AS STRING), '$.method'),
    `message_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.messageId'),
    `context_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.contextId'),
    `task_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.taskId'),
    `role` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.role'),
    `reference_task_ids` AS JSON_QUERY(CAST(`val` AS STRING), '$.params.message.referenceTaskIds'),
    `data_json` AS JSON_QUERY(CAST(`val` AS STRING), '$.params.message.parts[0].data'),
    `summary` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.parts[1].text'),
    `env_message_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].messageId'),
    `env_correlation_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].correlationId'),
    `env_causation_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].causationId'),
    `env_agent_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].agentId'),
    `env_agent_version` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].agentVersion'),
    `env_config_version` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].configVersion'),
    `env_event_time` AS TRY_CAST(JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].eventTime') AS BIGINT),
    `env_device_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].deviceId'),
    `env_customer_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].customerId'),
    `env_device_seq` AS TRY_CAST(JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].deviceSeq') AS BIGINT),
    `env_required_context_seq` AS TRY_CAST(JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].requiredContextSeq') AS BIGINT),
    `env_mode` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].mode'),
    `env_replay_run_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.params.message.metadata[''urn:device-trust-mesh:envelope:v1''].replayRunId'),
    `proc_time` AS PROCTIME()
    )
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
