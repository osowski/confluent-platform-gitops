apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: dtm-ddl-agent-task-events
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  flinkEnvironment: dtm-env
  computePoolName: dtm-shared-pool
  properties:
    sql.current-catalog: dtm-catalog
    sql.current-database: dtm-database
  statement: >-
    ALTER TABLE `agent.task-events` ADD (
    `rpc_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.id'),
    `kind` AS CASE WHEN JSON_EXISTS(CAST(`val` AS STRING), '$.result.artifactUpdate') THEN 'artifactUpdate' WHEN JSON_EXISTS(CAST(`val` AS STRING), '$.result.statusUpdate') THEN 'statusUpdate' WHEN JSON_EXISTS(CAST(`val` AS STRING), '$.result.task') THEN 'task' END,
    `task_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.taskId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.taskId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.id')),
    `context_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.contextId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.contextId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.contextId')),
    `state` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.status.state'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.status.state')),
    `status_time` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.status.timestamp'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.status.timestamp')),
    `status_text` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.status.message.parts[0].text'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.status.message.parts[0].text')),
    `artifact_id` AS JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.artifact.artifactId'),
    `artifact_name` AS JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.artifact.name'),
    `artifact_data_json` AS JSON_QUERY(CAST(`val` AS STRING), '$.result.artifactUpdate.artifact.parts[0].data'),
    `artifact_text` AS JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.artifact.parts[1].text'),
    `env_message_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].messageId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].messageId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].messageId')),
    `env_correlation_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].correlationId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].correlationId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].correlationId')),
    `env_causation_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].causationId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].causationId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].causationId')),
    `env_agent_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].agentId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].agentId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].agentId')),
    `env_agent_version` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].agentVersion'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].agentVersion'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].agentVersion')),
    `env_config_version` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].configVersion'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].configVersion'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].configVersion')),
    `env_event_time` AS TRY_CAST(COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].eventTime'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].eventTime'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].eventTime')) AS BIGINT),
    `env_device_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].deviceId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].deviceId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].deviceId')),
    `env_customer_id` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].customerId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].customerId'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].customerId')),
    `env_device_seq` AS TRY_CAST(COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].deviceSeq'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].deviceSeq'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].deviceSeq')) AS BIGINT),
    `env_required_context_seq` AS TRY_CAST(COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].requiredContextSeq'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].requiredContextSeq'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].requiredContextSeq')) AS BIGINT),
    `env_mode` AS COALESCE(JSON_VALUE(CAST(`val` AS STRING), '$.result.statusUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].mode'), JSON_VALUE(CAST(`val` AS STRING), '$.result.artifactUpdate.metadata[''urn:device-trust-mesh:envelope:v1''].mode'), JSON_VALUE(CAST(`val` AS STRING), '$.result.task.metadata[''urn:device-trust-mesh:envelope:v1''].mode')),
