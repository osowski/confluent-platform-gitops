# Schema Registry subjects for the Agentic Device Trust Mesh.
#
# Every schema is generated by scripts/generate-dtm-schemas.py from
# workloads/device-trust-mesh/schemas/ into base/schemas/, and published as a
# ConfigMap (dtm-schema-<name>) by the configMapGenerator in
# kustomization.yaml. Edit the sources and re-run the generator; never edit
# base/schemas/ by hand. `--check` fails on drift.
#
# Two wire formats:
#
#   * Business and derived topics are Avro under TopicNameStrategy subjects
#     (<topic>-value, plus a typed <topic>-key record on the compacted
#     device.context, customer.context and agent.cards_human_readable topics).
#     Producers use the Schema Registry wire format, and the dtm-catalog
#     FlinkKafkaCatalog infers typed tables from these subjects.
#
#   * A2A topics (agent.tasks.*, agent.task-events, agent.cards) carry plain
#     JSON: JSON-RPC 2.0 objects per A2A v1.0.1, with no Schema Registry wire
#     prefix. Their JSON Schemas (draft 2020-12) are registered for governance
#     and for agent-side validation before producing, under <topic>-a2a
#     subjects rather than <topic>-value. The catalog only reads
#     <topic>-value, so it infers these tables as raw key/val, and
#     flink-ddl.yaml adds typed computed columns. Registering them as
#     <topic>-value would break the tables outright: CMF cannot map JSON
#     Schema tuple arrays (the prefixItems that pin parts[0] to the data part
#     and parts[1] to the text part), so the catalog fails to load the table
#     at all, and even ALTER TABLE ... SET ('value.format' = 'raw') cannot run.
#
# metadata.name is the subject lower-cased with '.' and '_' replaced by '-';
# spec.name carries the exact subject.
---
apiVersion: platform.confluent.io/v1beta1
kind: Schema
metadata:
  name: device-events-value
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  name: device.events-value
  schemaRegistryClusterRef:
    name: schemaregistry
    namespace: kafka
  data:
    configRef: dtm-schema-device-events-value
    format: avro
  compatibilityLevel: BACKWARD
---
