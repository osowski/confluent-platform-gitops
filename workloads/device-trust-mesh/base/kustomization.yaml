apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # device-trust-mesh namespace is owned by workloads/namespaces (flink-demo
  # overlay) - not declared here.
  # Flink SQL CR chain, applied in dependency order via sync waves 5-70
  - flink-environment.yaml
  - flink-catalog-database.yaml
  - flink-compute-pool.yaml
  - flink-ddl.yaml
  - flink-statements.yaml
  - config.yaml
  - topics.yaml
  - schemas.yaml
  # One ConfigMap per schema (dtm-schema-<subject>), generated in
  # osowski/flink-sandbox and referenced by the Schema CRs in schemas.yaml.
  # Pinned to the commit of device-trust-mesh-v1.4.0; move it together with
  # the image tags.
  - https://github.com/osowski/flink-sandbox//device-trust-mesh/dtm/schemas?ref=f11774ab95c89b27a0913eb670dba109063b8ff7

# Common labels applied to all resources
labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/part-of: device-trust-mesh
    app.kubernetes.io/managed-by: argocd
