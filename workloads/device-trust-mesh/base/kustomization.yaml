    options:
      disableNameSuffixHash: true
  - name: dtm-schema-agent-cards-human-readable-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/agent.cards_human_readable-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-simulator-control-value
    namespace: device-trust-mesh
