      - schema=schemas/avro/audit.log-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-agent-llm-interactions-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/agent.llm-interactions-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-agent-tasks-human-readable-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/agent.tasks_human_readable-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-agent-decisions-human-readable-value
    namespace: device-trust-mesh
