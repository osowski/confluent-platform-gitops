apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # device-trust-mesh namespace is owned by workloads/namespaces (flink-demo
  # overlay) - not declared here.
  # Flink SQL CR chain, applied in dependency order via sync waves 5-70
  - flink-environment.yaml
  - flink-catalog-database.yaml
  - flink-compute-pool.yaml
  - flink-ddl.yaml
  - flink-statements.yaml
  - config.yaml
  - topics.yaml
  - schemas.yaml

# One ConfigMap per generated schema in schemas/, referenced by the Schema CRs
# in schemas.yaml. Regenerate with scripts/generate-dtm-schemas.py.
configMapGenerator:
  - name: dtm-schema-device-events-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/device.events-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-device-context-key
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/device.context-key.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-device-context-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/device.context-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-customer-context-key
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/customer.context-key.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-customer-context-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/customer.context-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-device-risk-signals-value
    namespace: device-trust-mesh
    files:
      - schema=schemas/avro/device.risk-signals-value.avsc
    options:
      disableNameSuffixHash: true
  - name: dtm-schema-device-policy-commands-value
    namespace: device-trust-mesh
