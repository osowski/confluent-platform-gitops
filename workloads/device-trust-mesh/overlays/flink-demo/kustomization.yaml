apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference base configuration
resources:
  - ../../base

# Base already targets native macOS host Ollama by default. Add the
# ollama-in-cluster-mode component to opt into in-cluster Ollama instead.

# RayService (context-mcp + agents) and simulator. Requires the
# kuberay-operator Application to be applied first.
components:
  - ../../components/mesh-runtime
  # Live mesh UI. Reads context-mcp, so it requires mesh-runtime.
  - ../../components/ui

# Cluster-specific labels
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      cluster: flink-demo
