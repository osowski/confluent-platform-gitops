apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference base configuration
resources:
  - ../../base

# Base already targets native macOS host Ollama by default. Add the
# ollama-in-cluster-mode component to opt into in-cluster Ollama instead.
#
# The mesh-runtime component (RayService + simulator) is added here once the
# kuberay-operator Application is applied and the device-trust-mesh images
# are published:
#
# components:
#   - ../../components/mesh-runtime

# Cluster-specific labels
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      cluster: flink-demo
