apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Order matters: device-cap sets DEVICE_CAP before mesh-runtime and
# context-service copy it into their consumers; ui and rbac-oauth patch
# resources that mesh-runtime declares; context-service patches the ui and
# session-reset resources, so it follows both, and precedes rbac-oauth.
components:
  - device-cap
  - ../../components/mesh-runtime
  - ../../components/ui
  # In-cluster session reset (reset-job.yaml).
  - ../../components/session-reset
  # Agents call the in-cluster Ollama on the GPU node.
  - ../../components/ollama-in-cluster-mode
  # Context service Deployment; points the UI and the reset script at it.
  - ../../components/context-service
  # Keycloak OAuth identities, MDS role bindings and client OAuth settings.
  - ../../components/rbac-oauth
  # Prometheus PodMonitors for the Ray pods and the context service, and the
  # Grafana dashboard.
  - ../../components/observability

patches:
  # Two replicas per enabled agent in agents.yaml.
  - path: agents-config-patch.yaml
  # JobManager memory.
  - path: flink-compute-pool-patch.yaml
  # Serve replicas, worker group size and worker spread.
  - path: rayservice-scale-patch.yaml
    target:
      group: ray.io
      version: v1
      kind: RayService
      name: device-trust-mesh

# osowski/flink-sandbox device-trust-mesh-v1.6.0 images: the Ray, simulator, UI
# and context service images share one tag. Same release as the schema remote
# base in base/kustomization.yaml.
images:
  - name: quay.io/osowski/device-trust-mesh-ray
    newTag: v1.6.0-202611181810
  - name: quay.io/osowski/device-trust-mesh-simulator
    newTag: v1.6.0-202611181810
  - name: quay.io/osowski/device-trust-mesh-ui
    newTag: v1.6.0-202611181810
  - name: quay.io/osowski/device-trust-mesh-context
    newTag: v1.6.0-202611181810

# Cluster-specific labels
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      cluster: eks-demo
