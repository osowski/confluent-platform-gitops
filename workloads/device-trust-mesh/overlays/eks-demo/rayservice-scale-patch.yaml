# Ray Serve and worker-group scale for eks-demo.
#
# serveConfigV2 is one string, so this replaces it whole: two replicas for
# context-mcp and each enabled agent (num_replicas stays <= the 6 topic
# partitions); revocation is disabled in agents.yaml and keeps one replica.
# Each agent replica reserves 0.1 CPU (dtm/mesh/agents/host.py) and each
# ContextMcp replica Serve's default 1 CPU: 2.9 CPU in total. The head
# advertises 0 CPU, so no Serve replica lands on it and it keeps its 2 Gi for
# GCS, the dashboard and the Serve controller; the two mesh workers (2 CPU
# each) hold every replica. In-tree autoscaling is off, so KubeRay runs
# exactly `replicas` workers; scale by editing `replicas` (up to
# maxReplicas: 4).
#
# Outside num_replicas, the serveConfigV2 copy must match
# components/mesh-runtime/rayservice.yaml; scripts/tests/test_overlay_copies.py
# fails if it doesn't.
#
# The test op pins index 0 to the mesh worker group, so a reordering in
# components/mesh-runtime fails the build rather than patching another group.
- op: test
  path: /spec/rayClusterConfig/workerGroupSpecs/0/groupName
  value: mesh
- op: replace
  path: /spec/serveConfigV2
  value: |
    applications:
      - name: context-mcp
        route_prefix: /context-mcp
        import_path: dtm.mesh.context_mcp:app
        deployments:
          - name: ContextMcp
            num_replicas: 2
      - name: risk
        route_prefix: /risk
        import_path: dtm.mesh.risk:app
        deployments:
          - name: RiskAgent
            num_replicas: 2
      - name: enrolment
        route_prefix: /enrolment
        import_path: dtm.mesh.enrolment:app
        deployments:
          - name: EnrolmentAgent
            num_replicas: 2
      - name: step-up
        route_prefix: /step-up
        import_path: dtm.mesh.step_up:app
        deployments:
          - name: StepUpAgent
            num_replicas: 2
      - name: compliance
        route_prefix: /compliance
        import_path: dtm.mesh.compliance:app
        deployments:
          - name: ComplianceAgent
            num_replicas: 2
      - name: revocation
        route_prefix: /revocation
        import_path: dtm.mesh.revocation:app
        deployments:
          - name: RevocationAgent
            num_replicas: 1
- op: add
  path: /spec/rayClusterConfig/headGroupSpec/rayStartParams/num-cpus
  value: "0"
- op: replace
  path: /spec/rayClusterConfig/workerGroupSpecs/0/replicas
  value: 2
- op: replace
  path: /spec/rayClusterConfig/workerGroupSpecs/0/maxReplicas
  value: 4
# Spread mesh workers across nodes.
- op: add
  path: /spec/rayClusterConfig/workerGroupSpecs/0/template/spec/affinity
  value:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                ray.io/node-type: worker
