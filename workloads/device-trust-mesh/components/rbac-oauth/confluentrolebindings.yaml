---
# LITERAL *: Confluent's managed Kafka sink derives transactional.id from
# the Flink job ID (a random UUID), and sink.transactional-id-prefix has no
# effect on it, so no prefix pattern can match. See ADR-0011.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-flink-transactionalids-write
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-flink
  role: DeveloperWrite
  resourcePatterns:
    - patternType: LITERAL
      name: "*"
      resourceType: TransactionalId
  kafkaRestClassRef:
    name: default
---
