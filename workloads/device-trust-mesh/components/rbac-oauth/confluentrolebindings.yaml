# MDS role bindings for the device-trust-mesh OAuth clients.
#
# Every binding targets a Keycloak group (principal.type: group). The Kafka
# internal listener maps the token's groups claim
# (listener.name.internal.sasl.oauthbearer.groups.claim.name=groups), and the
# setup Job puts each client's service-account user in its group:
#
#   sa-dtm-ray       -> dtm-ray        agents and context-mcp (one Ray principal)
#   sa-dtm-simulator -> dtm-simulator  device simulator
#   sa-dtm-ui        -> dtm-ui         mesh UI
#   sa-dtm-flink     -> dtm-flink      CMF catalog and Flink SQL statements
#
# Topics are bound LITERAL except agent.tasks. (PREFIXED), which is the
# per-skill task topic family. Schema Registry subjects are bound PREFIXED
# <topic>- so one pattern covers that topic's -key, -value and -a2a subjects
# and nothing else. The Python clients never auto-register schemas, so their
# subject grants are DeveloperRead only.

# ==============================================================================
# dtm-ray - agents and context-mcp
# ==============================================================================
---
# Read the A2A task, task-event, card and LLM-interaction topics, and the
# context topics context-mcp materializes.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-ray-topics-read
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-ray
  role: DeveloperRead
  resourcePatterns:
    - patternType: PREFIXED
      name: agent.tasks.
      resourceType: Topic
    - patternType: LITERAL
      name: agent.task-events
      resourceType: Topic
    - patternType: LITERAL
      name: agent.cards
      resourceType: Topic
    - patternType: LITERAL
      name: agent.llm-interactions
      resourceType: Topic
    - patternType: LITERAL
      name: device.context
      resourceType: Topic
    - patternType: LITERAL
      name: customer.context
      resourceType: Topic
    - patternType: LITERAL
      name: device.risk-signals
      resourceType: Topic
  kafkaRestClassRef:
    name: default
---
# Write A2A tasks, task events, Agent Cards, LLM interactions, policy
# commands and audit records.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-ray-topics-write
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-ray
  role: DeveloperWrite
  resourcePatterns:
    - patternType: PREFIXED
      name: agent.tasks.
      resourceType: Topic
    - patternType: LITERAL
      name: agent.task-events
      resourceType: Topic
    - patternType: LITERAL
      name: agent.cards
      resourceType: Topic
    - patternType: LITERAL
      name: agent.llm-interactions
      resourceType: Topic
    - patternType: LITERAL
      name: device.policy-commands
      resourceType: Topic
    - patternType: LITERAL
      name: audit.log
      resourceType: Topic
  kafkaRestClassRef:
    name: default
---
# Consumer groups dtm.<agent>.<mode>[.<run>] and dtm.context-mcp.<uuid>.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-ray-groups-read
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-ray
  role: DeveloperRead
  resourcePatterns:
    - patternType: PREFIXED
      name: dtm.
      resourceType: Group
  kafkaRestClassRef:
    name: default
---
# Schema lookups for every topic dtm-ray reads or writes.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-ray-subjects-read
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-ray
  role: DeveloperRead
  clustersScopeByIds:
    schemaRegistryClusterId: id_schemaregistry_kafka
  resourcePatterns:
    - patternType: PREFIXED
      name: agent.tasks.
      resourceType: Subject
    - patternType: PREFIXED
      name: agent.task-events-
      resourceType: Subject
    - patternType: PREFIXED
      name: agent.cards-
      resourceType: Subject
    - patternType: PREFIXED
      name: agent.llm-interactions-
      resourceType: Subject
    - patternType: PREFIXED
      name: device.policy-commands-
      resourceType: Subject
    - patternType: PREFIXED
      name: audit.log-
      resourceType: Subject
    - patternType: PREFIXED
      name: device.context-
      resourceType: Subject
    - patternType: PREFIXED
      name: customer.context-
      resourceType: Subject
    - patternType: PREFIXED
      name: device.risk-signals-
      resourceType: Subject

