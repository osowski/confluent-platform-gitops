# ==============================================================================
# dtm-flink - CMF catalog connection and Flink SQL statements
# ==============================================================================
# sa-dtm-flink is the Kafka identity of the dtm-database catalog connection
# (CMF lists topics and reads/writes the catalog metadata topic with it) and
# of every statement on the compute pool. dtm-env is in the database's
# ddlEnvironments, so per the CP Flink catalog requirements its Kafka
# credentials also need topic create/delete and write access to
# _confluent_sr_catalog. That metadata topic is created on first catalog use,
# so it is in every topic list below.
---
# Read every device-trust-mesh topic and the catalog metadata topic.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
