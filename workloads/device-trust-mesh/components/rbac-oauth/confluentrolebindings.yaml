# ==============================================================================
# dtm-env FlinkEnvironment
# ==============================================================================
---
# CMF service account - ClusterAdmin on dtm-env. CFK submits the
# device-trust-mesh Flink CRs to CMF as cmf, and the cluster-wide
# cmf-systemadmin binding does not authorize work inside an environment
# without this environment-scoped grant.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: cmf-clusteradmin-dtm-env
  namespace: kafka
spec:
  principal:
    type: user
    name: cmf
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: dtm-env
  kafkaRestClassRef:
    name: default
---
# Admin user - ClusterAdmin on dtm-env.
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-clusteradmin-dtm-env
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@dspdemos.com
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: dtm-env
  kafkaRestClassRef:
    name: default
---
# dtm-flink group - DeveloperManage on the dtm-env FlinkEnvironment
# resource (catalog and database access follow environment permissions).
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: dtm-flink-developermanage-env
  namespace: kafka
spec:
  principal:
    type: group
    name: dtm-flink
  role: DeveloperManage
  clustersScopeByIds:
    cmfId: CMF-id
  resourcePatterns:
    - patternType: LITERAL
      name: dtm-env
      resourceType: FlinkEnvironment
  kafkaRestClassRef:
    name: default
