      resourceType: Topic
    - patternType: LITERAL
      name: agent.task-events
      resourceType: Topic
    - patternType: LITERAL
      name: agent.cards
      resourceType: Topic
    - patternType: LITERAL
      name: agent.llm-interactions
      resourceType: Topic
    - patternType: LITERAL
      name: agent.tasks_human_readable
      resourceType: Topic
    - patternType: LITERAL
