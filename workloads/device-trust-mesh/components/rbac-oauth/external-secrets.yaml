---
# CMF credential chain for Flink SQL, both built from sa-dtm-flink. The
# FlinkSecret / FlinkEnvironmentSecretMapping resources that reference these
# Secrets carry the naming rules; see colors-and-shapes' flink-secrets.yaml.
#
# Kafka connection properties for the dtm-database catalog and the compute
# pool's statements.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dtm-cmf-kafka-credentials
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dtm-secrets-manager
    kind: SecretStore
  target:
    name: dtm-cmf-kafka-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        security.protocol: "SASL_PLAINTEXT"
        sasl.mechanism: "OAUTHBEARER"
        sasl.oauthbearer.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
        sasl.login.callback.handler.class: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler"
        sasl.jaas.config: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId='{{ .client_id }}' clientSecret='{{ .client_secret }}' scope='profile email';"
  dataFrom:
    - extract:
        key: /device-trust-mesh/eks-demo/sa-dtm-flink
---
# Schema Registry client properties for the dtm-catalog.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dtm-cmf-sr-credentials
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dtm-secrets-manager
    kind: SecretStore
  target:
    name: dtm-cmf-sr-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        bearer.auth.credentials.source: "OAUTHBEARER"
        bearer.auth.client.id: "{{ .client_id }}"
        bearer.auth.client.secret: "{{ .client_secret }}"
        bearer.auth.scope: "profile email"
        # Both endpoint keys are set: the standard Confluent SR client reads
        # `bearer.auth.issuer.endpoint.url`, the FlinkEnvironment's
        # `table.sql-catalog.confluent.schema-registry.*` block uses
        # `bearer.auth.token.endpoint.url`, and which one CMF's bundled SR
        # client honours is undocumented. The unused one is ignored.
        bearer.auth.issuer.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
        bearer.auth.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  dataFrom:
    - extract:
        key: /device-trust-mesh/eks-demo/sa-dtm-flink
