---
# Client credentials synced from AWS Secrets Manager. Each Secrets Manager
# secret is a JSON object {"client_id": ..., "client_secret": ...}; the
# templates below render it into the Secret shape the DTM workloads read.
#
# Client OAuth Secrets: keys client-id / client-secret.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dtm-ray-oauth
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dtm-secrets-manager
    kind: SecretStore
  target:
    name: dtm-ray-oauth
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: /device-trust-mesh/eks-demo/sa-dtm-ray
