---
# Creates the device-trust-mesh Keycloak OAuth clients and their groups.
#
# For each client (sa-dtm-ray, sa-dtm-simulator, sa-dtm-ui, sa-dtm-flink):
#   * ensures the Keycloak group (dtm-ray, dtm-simulator, dtm-ui, dtm-flink)
#     exists - the ConfluentRolebindings grant to these groups;
#   * creates the confidential client, or PUTs the secret onto an existing
#     one, so the Secrets Manager value is always the one Keycloak accepts;
#   * adds the client's service-account user to its group and the email,
#     groups and client_id protocol mappers;
#   * verifies a client-credentials token whose client_id and groups claims
#     match.
#
# Client IDs and secrets come from the ESO-synced dtm-*-oauth Secrets; admin
# credentials from the keycloak-admin Secret that Reflector mirrors into
# device-trust-mesh. Secrets reach curl on stdin, never on the command line,
# and the script prints no secret, token or token response.
#
# A Sync hook at wave -1 runs after the wave -2 ExternalSecrets are healthy
# (their Secrets exist) and before the workloads that authenticate as these
# clients.
apiVersion: batch/v1
kind: Job
metadata:
  name: dtm-service-account-setup
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: dtm-service-account-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: setup
          image: curlimages/curl:8.1.2
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.keycloak.svc.cluster.local:8080"
            - name: REALM
              value: "confluent"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: RAY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dtm-ray-oauth
                  key: client-id
            - name: RAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dtm-ray-oauth
                  key: client-secret
            - name: SIMULATOR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dtm-simulator-oauth
                  key: client-id
            - name: SIMULATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dtm-simulator-oauth
                  key: client-secret
            - name: UI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dtm-ui-oauth
                  key: client-id
            - name: UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dtm-ui-oauth
                  key: client-secret
            - name: FLINK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dtm-flink-oauth
                  key: client-id
            - name: FLINK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dtm-flink-oauth
                  key: client-secret
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              ADMIN_API="${KEYCLOAK_URL}/admin/realms/${REALM}"
              TOKEN_URL="${KEYCLOAK_URL}/realms/${REALM}/protocol/openid-connect/token"

              fail() {
                echo "ERROR: $*"
                exit 1
              }

              first_id() {
                grep -o '"id":"[^"]*' | head -n1 | cut -d'"' -f4
              }

              access_token() {
                grep -o '"access_token":"[^"]*' | cut -d'"' -f4
              }

              kc_get() {
                curl -s -H "Authorization: Bearer ${ADMIN_TOKEN}" "${ADMIN_API}$1"
              }

              # kc_send METHOD PATH: JSON body on stdin, prints the HTTP status
              kc_send() {
                curl -s -o /dev/null -w '%{http_code}' -X "$1" \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data-binary @- "${ADMIN_API}$2"
              }

              # Sets gid to the UUID of the top-level group named $1.
              ensure_group() {
                g_name=$1
                gid=$(kc_get "/groups?search=${g_name}&exact=true" | first_id)
                if [ -z "$gid" ]; then
                  code=$(printf '{"name":"%s"}' "$g_name" | kc_send POST /groups)
                  [ "$code" = "201" ] || fail "creating group ${g_name} returned HTTP ${code}"
                  gid=$(kc_get "/groups?search=${g_name}&exact=true" | first_id)
                  [ -n "$gid" ] || fail "group ${g_name} not found after create"
                  echo "  Created group ${g_name}"
                else
                  echo "  Group ${g_name} exists"
                fi
              }

              ensure_mapper() {
                m_client=$1 m_name=$2 m_body=$3
                if kc_get "/clients/${m_client}/protocol-mappers/models" | grep -q "\"name\":\"${m_name}\""; then
                  return 0
                fi
                code=$(printf '%s' "$m_body" | kc_send POST "/clients/${m_client}/protocol-mappers/models")
                [ "$code" = "201" ] || fail "adding ${m_name} mapper returned HTTP ${code}"
                echo "  Added ${m_name} protocol mapper"
              }

              setup_client() {
                id=$1 secret=$2 group=$3
                [ -n "$id" ] || fail "empty client id for group ${group}"
                [ -n "$secret" ] || fail "empty client secret for ${id}"
                echo "Client ${id} -> group ${group}"

                ensure_group "$group"

                body=$(printf '{"clientId":"%s","enabled":true,"clientAuthenticatorType":"client-secret","secret":"%s","serviceAccountsEnabled":true,"standardFlowEnabled":false,"directAccessGrantsEnabled":false,"publicClient":false,"protocol":"openid-connect"}' "$id" "$secret")
                uuid=$(kc_get "/clients?clientId=${id}" | first_id)
                if [ -z "$uuid" ]; then
                  code=$(printf '%s' "$body" | kc_send POST /clients)
                  [ "$code" = "201" ] || fail "creating client ${id} returned HTTP ${code}"
                  uuid=$(kc_get "/clients?clientId=${id}" | first_id)
                  [ -n "$uuid" ] || fail "client ${id} not found after create"
                  echo "  Created client"
                else
                  code=$(printf '%s' "$body" | kc_send PUT "/clients/${uuid}")
                  [ "$code" = "204" ] || fail "updating client ${id} returned HTTP ${code}"
                  echo "  Updated existing client (secret set from Secrets Manager)"
                fi

                sa_user=$(kc_get "/clients/${uuid}/service-account-user" | first_id)
                [ -n "$sa_user" ] || fail "no service-account user for ${id}"
                code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
                  -H "Authorization: Bearer ${ADMIN_TOKEN}" \
                  "${ADMIN_API}/users/${sa_user}/groups/${gid}")
                [ "$code" = "204" ] || fail "adding ${id} to ${group} returned HTTP ${code}"
                echo "  Service-account user is a member of ${group}"

                ensure_mapper "$uuid" email '{"name":"email","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"email","claim.name":"email","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}'
                ensure_mapper "$uuid" groups '{"name":"groups","protocol":"openid-connect","protocolMapper":"oidc-group-membership-mapper","config":{"claim.name":"groups","full.path":"false","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}'
                ensure_mapper "$uuid" client_id '{"name":"client_id","protocol":"openid-connect","protocolMapper":"oidc-usersessionmodel-note-mapper","config":{"user.session.note":"client_id","claim.name":"client_id","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true"}}'
              }

              verify_client() {
                id=$1 secret=$2 group=$3
                echo "Verifying ${id}"
                token=$(printf '%s' "$secret" | curl -s -X POST "$TOKEN_URL" \
                  -d grant_type=client_credentials \
                  --data-urlencode "client_id=${id}" \
                  --data-urlencode "client_secret@-" | access_token)
                [ -n "$token" ] || fail "no client-credentials token for ${id}"
                echo "  Token issued"

                if ! command -v base64 >/dev/null 2>&1; then
                  echo "  WARNING: base64 unavailable, claims not checked"
                  return 0
                fi
                payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
                case $(( ${#payload} % 4 )) in
                  2) payload="${payload}==" ;;
                  3) payload="${payload}=" ;;
                esac
                claims=$(printf '%s' "$payload" | base64 -d 2>/dev/null || true)
                printf '%s' "$claims" | grep -q "\"client_id\":\"${id}\"" \
                  || fail "token for ${id} lacks client_id claim ${id}"
                printf '%s' "$claims" | grep -q "\"groups\":\[[^]]*\"${group}\"" \
                  || fail "token for ${id} lacks ${group} in its groups claim"
                echo "  Claims: client_id=${id}, groups contains ${group}"
              }

              echo "Keycloak: ${KEYCLOAK_URL} realm ${REALM}"
              ADMIN_TOKEN=$(printf '%s' "$ADMIN_PASS" | curl -s -X POST \
                "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                -d client_id=admin-cli \
                -d grant_type=password \
                --data-urlencode "username=${ADMIN_USER}" \
                --data-urlencode "password@-" | access_token)
              [ -n "$ADMIN_TOKEN" ] || fail "could not obtain an admin token"
              echo "Admin token obtained"
              echo ""

              setup_client "$RAY_CLIENT_ID" "$RAY_CLIENT_SECRET" dtm-ray
              setup_client "$SIMULATOR_CLIENT_ID" "$SIMULATOR_CLIENT_SECRET" dtm-simulator
              setup_client "$UI_CLIENT_ID" "$UI_CLIENT_SECRET" dtm-ui
              setup_client "$FLINK_CLIENT_ID" "$FLINK_CLIENT_SECRET" dtm-flink
              echo ""

              verify_client "$RAY_CLIENT_ID" "$RAY_CLIENT_SECRET" dtm-ray
              verify_client "$SIMULATOR_CLIENT_ID" "$SIMULATOR_CLIENT_SECRET" dtm-simulator
              verify_client "$UI_CLIENT_ID" "$UI_CLIENT_SECRET" dtm-ui
              verify_client "$FLINK_CLIENT_ID" "$FLINK_CLIENT_SECRET" dtm-flink
              echo ""
              echo "device-trust-mesh OAuth clients ready"
