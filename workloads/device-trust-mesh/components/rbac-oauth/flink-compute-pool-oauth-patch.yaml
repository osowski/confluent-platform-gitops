# OAuth allow-list: the cp-flink-sql image's shaded Kafka client enforces an
# OAUTHBEARER token-endpoint allow-list that defaults to empty. Without this,
# the pool's Flink job crash-loops with "URL cannot be accessed due to
# restrictions".
#
# The flag goes on the JobManager and TaskManager keys, not env.java.opts.all:
# both JVMs run Kafka clients (the source enumerator on the JobManager, the
# readers and writers on the TaskManagers), and Flink appends each key to
# env.java.opts.all, so another component can still set that key.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkComputePool
metadata:
  name: dtm-shared-pool
  namespace: device-trust-mesh
spec:
  clusterSpec:
    flinkConfiguration:
      env.java.opts.jobmanager: "-Dorg.apache.flink.kafka.shaded.org.apache.kafka.sasl.oauthbearer.allowed.urls=set-by-replacements"
      env.java.opts.taskmanager: "-Dorg.apache.flink.kafka.shaded.org.apache.kafka.sasl.oauthbearer.allowed.urls=set-by-replacements"
