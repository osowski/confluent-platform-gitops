# OAuth allow-list: the cp-flink-sql image's shaded Kafka client enforces an
# OAUTHBEARER token-endpoint allow-list that defaults to empty. Without this,
# the pool's Flink job crash-loops with "URL cannot be accessed due to
# restrictions".
#
# This value replaces env.java.opts.all wholesale. base/flink-compute-pool.yaml
# sets no env.java.opts.all; if it gains one, carry its flags into this value.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkComputePool
metadata:
  name: dtm-shared-pool
  namespace: device-trust-mesh
spec:
  clusterSpec:
    flinkConfiguration:
      env.java.opts.all: "-Dorg.apache.flink.kafka.shaded.org.apache.kafka.sasl.oauthbearer.allowed.urls=http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
