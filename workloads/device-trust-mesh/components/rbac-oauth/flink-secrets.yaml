---
# CMF credential chain for the device-trust-mesh Flink SQL environment.
#
# NAMING IS CRITICAL - all THREE names must be identical:
#
#   FlinkSecret.metadata.name
#     == FlinkEnvironmentSecretMapping.metadata.name
#     == the connectionSecretId / connectionSecretRef that references them
#        (flink-catalog-database-oauth-patch.yaml)
#
# CMF keys an environment's secrets by the mapping name and silently ignores a
# catalog whose connectionSecretId is unmapped; CFK resolves connectionSecretId
# to a FlinkSecret in the same namespace and fails reconciliation on a
# mismatch. See colors-and-shapes' rbac-oauth/flink-secrets.yaml.
#
# Both mappings carry the sa-dtm-flink identity, synced from Secrets Manager
# into dtm-cmf-kafka-credentials / dtm-cmf-sr-credentials (external-secrets.yaml).
# CMF merges the mapped SR secret into the catalog's Schema Registry connection
# properties for every statement, so FlinkEnvironment.flinkConfiguration
# carries no Schema Registry credential.
#
# Apply order is enforced by sync waves: ExternalSecret (-2) ->
# FlinkSecret (20) -> FlinkEnvironmentSecretMapping (30) -> catalog (40) ->
# database (50).
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-dtm
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: dtm-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-dtm
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: dtm-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-dtm
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: dtm-env
  secretRef:
    name: kafka-conn-secret-id-dtm
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-dtm
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: dtm-env
  secretRef:
    name: sr-conn-secret-id-dtm
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
