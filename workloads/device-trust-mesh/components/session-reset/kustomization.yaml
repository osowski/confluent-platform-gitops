---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# In-cluster session reset. Argo CD syncs the ServiceAccount, RBAC, the
# script and its settings; each reset runs as a Job started from
# ../../reset-job.yaml with `kubectl create -f`, outside Argo CD.
#
# The Roles reach into the kafka namespace (exec into the broker) and the
# argocd namespace (sync the device-trust-mesh Application), so they carry
# their namespaces explicitly; an overlay using this component must not set
# a kustomize namespace transformer.
resources:
  - rbac.yaml
  - settings.yaml

# Fixed names: reset-job.yaml mounts the script by name.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: dtm-reset-script
    namespace: device-trust-mesh
    files:
      - reset-session.sh
