# Grafana dashboard for the mesh's ray_dtm_* and ray_serve_* metrics, loaded by
# the kube-prometheus-stack dashboard sidecar (grafana_dashboard label, all
# namespaces). The stat row shows the acceptance targets: context tool p99 < 20 ms,
# materialization lag p99 < 1 s, agent hop p99 < 100 ms. Panels use histogram
# buckets only: Ray estimates a histogram's _sum from bucket midpoints.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-device-trust-mesh
  namespace: device-trust-mesh
  labels:
    grafana_dashboard: "1"
data:
  device-trust-mesh-dashboard.json: |-
