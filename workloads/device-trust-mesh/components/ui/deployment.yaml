# Device Trust Mesh UI Deployment
# Serves the live board on :8080 and pushes updates to browsers over
# Server-Sent Events. Reads the human-readable and aggregate topics with
# read_committed under a unique per-process group id (offsets are never
# committed) and polls context-mcp for the device table. The image is built
# from osowski/flink-sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-trust-mesh-ui
  namespace: device-trust-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "95"
  labels:
    app: device-trust-mesh-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-trust-mesh-ui
  template:
    metadata:
      labels:
        app: device-trust-mesh-ui
    spec:
      containers:
        - name: ui
          image: quay.io/osowski/device-trust-mesh-ui:v1.2.0-202611031905
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Kafka connection (internal listener)
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9071"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schemaregistry.kafka.svc.cluster.local:8081"
            # context-mcp endpoint served by the RayService
            - name: DTM_UI_CONTEXT_URL
              value: "http://device-trust-mesh-serve-svc.device-trust-mesh.svc.cluster.local:8000/context-mcp"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
