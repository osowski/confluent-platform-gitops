---
# cmf.* is the direct CMF endpoint for programmatic/CLI access (clients present
# their own bearer token; CMF validates + authorizes). Browser SSO lives on the
# separate cmf-ui.* host (see cmf-ui-ingressroute.yaml) so oauth2-proxy never
# intercepts CLI/API traffic here.
#
# scheme: https + serversTransport (#423 follow-up) - CMF's own listener on
# cmf-service:80/8080 became HTTPS-only once cmf.ssl was enabled for CFK's
# mTLS leg; Traefik's backend hop must speak TLS too now, not just its
# edge (websecure/cmf-tls) side. See cmf-backend-transport.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cmf
  namespace: operator
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cmf.flink-demo-rbac.confluentdemo.local`)
      kind: Rule
      services:
        - name: cmf-service
          port: 80
          scheme: https
          serversTransport: cmf-backend-transport
  tls:
    secretName: cmf-tls
