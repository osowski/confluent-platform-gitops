---
# cmf-ui.* is a URL-parity alias that routes straight to CMF (same backend as
# cmf.*). CMF's own native SSO (cmf.ui.auth) handles browser login on either
# host, so no separate reverse proxy is needed here.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cmf-ui
  namespace: operator
  annotations:
    argocd.argoproj.io/sync-wave: "118"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cmf-ui.eks-demo.platform.dspdemos.com`)
      kind: Rule
      services:
        - name: cmf-service
          port: 80
          scheme: http
  tls:
    secretName: cmf-tls
