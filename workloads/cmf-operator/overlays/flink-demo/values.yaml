# Confluent Manager for Apache Flink - flink-demo Cluster Overlay
# Cluster-specific configuration overrides

# Additional pod annotations for flink-demo cluster identification
podAnnotations:
  cluster: flink-demo

cmf:
  sql:
    examples-catalog:
      enabled: true

    # Environment catalog (CMF 2.4.0+, opt-in) - issue #335.
    #
    # Registers a writable `_env_<environment>` catalog with a `default` database
    # in every environment. Unlike the built-in Kafka catalogs, it stores table
    # and function metadata in CMF's own database - no Schema Registry or Kafka
    # cluster involved. Enabled here to test Flink SQL DDL against Confluent
    # Cloud Kafka without any grant on the `_confluent_sr_catalog` metadata
    # topic, which Kafka-catalog DDL requires and which CP Flink tries to CREATE
    # when it doesn't already exist.
    #
    # Requires artifact management for functions and custom connectors - already
    # enabled for all clusters in ../../base/values.yaml (MinIO-backed).
    #
    # Verify: GET /cmf/api/v1/environments/<env>/catalog returns 200 (404 = disabled).
    environmentCatalog:
      enabled: true
