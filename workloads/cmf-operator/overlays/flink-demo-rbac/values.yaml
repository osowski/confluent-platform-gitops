# Confluent Manager for Apache Flink - flink-demo-rbac Cluster Overlay
# Cluster-specific configuration overrides

# Additional pod annotations for flink-demo-rbac cluster identification
podAnnotations:
  cluster: flink-demo-rbac

# Debug logging for authorization troubleshooting
env:
  - name: LOGGING_LEVEL_IO_CONFLUENT_CMF
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_RBAC
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_COMMON_SECURITY
    value: DEBUG

# extraEnv is a list, and Helm's multi -f value-file merge REPLACES list
# values wholesale rather than concatenating them (verified empirically) -
# so this overlay must repeat base/values.yaml's AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY entries alongside its own additions, or the base
# entries silently disappear and MinIO artifact storage breaks.
#
# CMF_SSL_KEYSTORE_PASSWORD/CMF_SSL_TRUSTSTORE_PASSWORD back the
# ${ENV_VAR} placeholders used in cmf.ssl below (#423) - this is the
# documented mechanism (docs-cp-flink/installation/helm.rst,
# "Inject secrets with environment variables"): CMF resolves ${ENV_VAR}
# placeholders anywhere in its config at startup. A secretKeyRef nested
# directly under cmf.ssl.key-store-password (as in the original task
# brief) does NOT work - confluent-manager-for-apache-flink's
# templates/configmap.yaml passes the entire cmf.ssl block through
# `toYaml` verbatim with no Helm-side resolution, so any such value
# would land in the rendered CMF config file as a literal, unresolved
# YAML object.
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: root-user
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: root-password
  - name: CMF_SSL_KEYSTORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cfk-cmf-jks-passwords
        key: keystore-password
  - name: CMF_SSL_TRUSTSTORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cfk-cmf-jks-passwords
        key: truststore-password

# Encryption of CMF Secrets - required by the FlinkSecret CRD, which syncs
# Kubernetes Secrets into CMF's metadata database. CMF uses AES-GCM.
#
# WARNING: encryption mode is fixed at database initialization. A CMF database
# initialized with encryption disabled can NEVER be switched to enabled (and
# vice versa), and the key can never be rotated. Turning this on against an
# existing CMF database therefore requires a fresh database - see the cluster
# README for the reset procedure.
#
# The chart defaults enabled to false, so this must be set explicitly; setting
# only `key` below leaves encryption off and CMF logs a startup warning.
encryption:
  enabled: true
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

# CMF configuration - authentication, authorization, and login all run
# through CMF's own embedded MDS (#418), backed by the OpenLDAP directory.
cmf:
  # Enable stack traces in error responses for debugging authorization issues
  stackTraceLogging: true

  # Database configuration - Use PostgreSQL instead of embedded SQLite
  # SQLite has severe lock contention issues under concurrent operations
  database:
    type: jdbc
    jdbc:
      engine: postgresql
      database: cmf
      url: cmf-postgres.operator.svc.cluster.local
      user: cmf
      password:
        kubernetesSecretName: cmf-postgres-credentials
        kubernetesSecretProperty: POSTGRES_PASSWORD
      port: 5432
      options: ""

  # Embedded MDS (#418) - CMF runs its own MDS instance, entirely
  # independent of the Kafka broker's own MDS (#410/#411). Authenticates
  # directly against the existing OpenLDAP directory using the same
  # read-only bind identity (uid=mds) Kafka's broker MDS already uses -
  # not a Kafka RBAC principal, just a directory-search credential, so
  # reusing it (rather than seeding a new one) is safe and simplest.
  mds:
    enabled: true
    port: 8090
    authentication-method: BEARER
    token-key-path: /mnt/secrets/mds/tokenKeypair.pem
    public-key-path: /mnt/secrets/mds/tokenPublicKey.pem
    user-store: LDAP_WITH_OAUTH
    callback-handler-class: io.confluent.security.auth.provider.ldap.LdapAuthenticateCallbackHandler
    sasl-mechanism: PLAIN
    # Dedicated top-level fields (embedded-mds.rst's OIDC(OAuth) worked
    # example sets these exact two at this exact level) - the doc's own
    # auto-detection table ties jwks-endpoint-url + callback-handler-class
    # to LDAP_WITH_OAUTH specifically. Neither was ever set here in the
    # first two attempts (#419) - expected-issuer alone had no effect,
    # which is consistent with the chart gating on jwks-endpoint-url
    # before wiring either into the embedded MDS's own JwtAuthenticator.
    jwks-endpoint-url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs
    expected-issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent
    # User:cfk-operator (#423) - CFK's mTLS client certificate CN
    # (cfk-cmf-client-cert, Task 1) maps to principal "cfk-operator" via
    # auth.ssl.principal.mapping.rules above. Granted full superuser here,
    # same coarse grant as User:admin, rather than a scoped role binding -
    # a deliberate simplification for this issue (CFK needs broad access
    # to manage FlinkEnvironment/FlinkApplication/etc. across the
    # `flink` namespace's CMF resources; the embedded MDS's role-binding
    # surface for a service-account-style principal wasn't scoped out as
    # part of #423). A properly scoped binding is a reasonable follow-up
    # issue if per-resource RBAC for CFK's own principal becomes a
    # requirement. Multi-value syntax (semicolon-separated, "User:x;User:y")
    # confirmed against the chart schema (values.schema.json's
    # definitions.mdsBlock.properties.super-users is a plain string with no
    # separator documented in-schema) and cross-checked against the
    # standard Kafka/MDS super.users convention used elsewhere in this repo
    # and Confluent's own docs (docs-platform/security/security_tutorial.rst,
    # rbac/delta_configs/server.properties.delta).
    super-users: "User:admin;User:cfk-operator"
    extra-configs:
      ldap.java.naming.provider.url: ldap://openldap.openldap.svc.cluster.local:389
      ldap.java.naming.security.principal: uid=mds,ou=services,dc=confluentdemo,dc=local
      ldap.java.naming.security.credentials: mds-bind-password
      ldap.java.naming.security.authentication: simple
      ldap.user.search.base: ou=users,dc=confluentdemo,dc=local
      ldap.user.name.attribute: uid
      ldap.user.object.class: inetOrgPerson
      ldap.search.mode: GROUPS
      ldap.group.search.base: ou=groups,dc=confluentdemo,dc=local
      ldap.group.object.class: groupOfNames
      ldap.group.name.attribute: cn
      ldap.group.member.attribute: member
      ldap.group.member.attribute.pattern: uid=(.*),ou=users,dc=confluentdemo,dc=local
      # OIDC/SSO secondary user store (LDAP_WITH_OAUTH, #418/#419) - reuses
      # the existing "cmf" Keycloak client (wildcard redirect URI, already
      # provisioned in workloads/keycloak/). Confirmed rendering correctly
      # into the embedded MDS's OidcConfig on the prior attempt - the part
      # that was missing lived in cmf.authentication.config below, not here.
      confluent.metadata.server.sso.mode: oidc
      confluent.oidc.idp.client.id: cmf
      confluent.oidc.idp.client.secret: cmf-secret
      confluent.oidc.idp.issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent
      confluent.oidc.idp.jwks.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs
      confluent.oidc.idp.authorize.base.endpoint.uri: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent/protocol/openid-connect/auth
      confluent.oidc.idp.token.base.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token
      confluent.oidc.idp.device.authorization.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/auth/device

  # Server SSL/TLS (#423) - configures HTTPS for incoming client connections
  # to CMF itself (Spring Boot server.ssl.* properties, per
  # docs-cp-flink/installation/authentication.rst's "Understanding SSL
  # configuration in CMF"). Independent of cmf.mds.* (the embedded MDS's
  # own listener) and of confluent.metadata.ssl.* (CMF-to-MDS, which does
  # not apply here since authorization.authority: cmf talks to the
  # embedded MDS over loopback).
  #
  # Field names (keystore/keystore-password vs. trust-store/
  # trust-store-password) are exactly as documented - not a typo, just an
  # inconsistency in CMF's own property names, confirmed against two
  # independent doc examples (authentication.rst, embedded-mds.rst).
  #
  # client-auth: want (not need) is deliberate - LDAP-only sessions (the
  # CMF UI, Keycloak SSO) present no client certificate and must keep
  # working; only CFK's CMFRestClass is expected to authenticate via mTLS.
  ssl:
    keystore: /mnt/secrets/tls/keystore.jks
    keystore-password: ${CMF_SSL_KEYSTORE_PASSWORD}
    trust-store: /mnt/secrets/tls/truststore.jks
    trust-store-password: ${CMF_SSL_TRUSTSTORE_PASSWORD}
    client-auth: want

  # Validate MDS-issued JWTs locally using the embedded MDS's own public
  # key. "type: oauth" here means "validate a bearer JWT via public key" -
  # not "go through an external IdP" - per the doc's own LDAP example.
  # (The prior attempt's oauthbearer.* additions here were unproven and
  # didn't fix the crash - reverted to isolate this test to the single
  # cmf.mds.jwks-endpoint-url/expected-issuer variable above.)
  #
  # type: mtls (#423) - identifies the client principal from the client
  # certificate presented during the mTLS handshake (CFK's CMFRestClass,
  # Task 3) instead of validating a bearer JWT. public.key.path and
  # confluent.metadata.bootstrap.server.urls are unchanged from the prior
  # oauth config - they configure the embedded MDS connection, not the
  # client-authentication mechanism itself.
  authentication:
    type: mtls
    config:
      auth.ssl.principal.mapping.rules: "RULE:^CN=(.*?),.*$/$1/,DEFAULT"
      public.key.path: /mnt/secrets/mds/tokenPublicKey.pem
      confluent.metadata.bootstrap.server.urls: http://localhost:8090

  # Required unconditionally by CMF's chart validator regardless of
  # whether an external OAuth IdP is involved (confirmed empirically
  # during #412's live verification - IllegalStateException otherwise).
  kafka:
    oauthbearerAllowedUrls: "http://localhost:8090"

  # Authorize Flink/CMF resources through the embedded MDS (mutually
  # exclusive with mdsRestConfig, which must not appear anywhere in this
  # file - authority=cmf is incompatible with mdsRestConfig).
  authorization:
    authority: cmf

  # LDAP credentials via the CMF UI's Basic login form, plus Keycloak SSO
  # via OIDC (LDAP_WITH_OAUTH, #418/#419) - both login paths are available.
  ui:
    auth:
      basicAuthEnabled: true
      ssoEnabled: true

# Mount CMF's own embedded-MDS key pair (#418) - distinct from the Kafka
# broker's mds-token secret, which this overlay does not reference (CMF
# validates its own embedded MDS's locally-issued JWTs, not the broker's).
#
# cmf-server-tls (#423) - the keystore/truststore produced by Task 1's
# cert-manager Certificate, backing the cmf.ssl block above.
mountedVolumes:
  volumes:
    - name: cmf-embedded-mds-keypair
      secret:
        secretName: cmf-embedded-mds-keypair
    - name: cmf-server-tls
      secret:
        secretName: cmf-server-tls
  volumeMounts:
    - name: cmf-embedded-mds-keypair
      mountPath: /mnt/secrets/mds
    - name: cmf-server-tls
      mountPath: /mnt/secrets/tls
