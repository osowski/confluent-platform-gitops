# Confluent Manager for Apache Flink - flink-demo-rbac Cluster Overlay
# Cluster-specific configuration overrides

# Additional pod annotations for flink-demo-rbac cluster identification
podAnnotations:
  cluster: flink-demo-rbac

# Debug logging for authorization troubleshooting
env:
  - name: LOGGING_LEVEL_IO_CONFLUENT_CMF
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_RBAC
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_COMMON_SECURITY
    value: DEBUG

# Encryption of CMF Secrets - required by the FlinkSecret CRD, which syncs
# Kubernetes Secrets into CMF's metadata database. CMF uses AES-GCM.
#
# WARNING: encryption mode is fixed at database initialization. A CMF database
# initialized with encryption disabled can NEVER be switched to enabled (and
# vice versa), and the key can never be rotated. Turning this on against an
# existing CMF database therefore requires a fresh database - see the cluster
# README for the reset procedure.
#
# The chart defaults enabled to false, so this must be set explicitly; setting
# only `key` below leaves encryption off and CMF logs a startup warning.
encryption:
  enabled: true
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

# OAuth authentication configuration for CMF REST API
# Validates bearer tokens from Keycloak for incoming client requests
# IMPORTANT: CMF validates MDS-signed tokens using the MDS public key
cmf:
  # Enable stack traces in error responses for debugging authorization issues
  stackTraceLogging: true

  # Database configuration - Use PostgreSQL instead of embedded SQLite
  # SQLite has severe lock contention issues under concurrent operations
  database:
    type: jdbc
    jdbc:
      engine: postgresql
      database: cmf
      url: cmf-postgres.operator.svc.cluster.local
      user: cmf
      password:
        kubernetesSecretName: cmf-postgres-credentials
        kubernetesSecretProperty: POSTGRES_PASSWORD
      port: 5432
      options: ""

  authentication:
    type: oauth
    config:
      # JWKS endpoint for token validation (internal cluster DNS)
      oauthbearer.jwks.endpoint.url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs

      # Token issuer name for MDS-signed tokens
      token.issuer: Confluent

      # Expected issuer must match the external URL that clients use
      # This is what appears in the token's "iss" claim
      # Must match KC_HOSTNAME setting in Keycloak deployment
      oauthbearer.expected.issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent

      # Principal claim - use client_id as the user identifier
      # This works for both service accounts (client_id from service account) and
      # user accounts (client_id is set by the controlcenter client via protocol mapper)
      oauthbearer.sub.claim.name: client_id

      # Groups claim - extract group membership from tokens
      oauthbearer.groups.claim.name: groups

      # MDS public key path for validating MDS-signed SSO tokens from Control Center
      # Control Center uses SSO tokens signed by MDS, not direct OAuth tokens
      public.key.path: /mount/mds/mdsPublicKey.pem

      # MDS metadata server URLs for token validation
      confluent.metadata.bootstrap.server.urls: http://kafka.kafka.svc.cluster.local:8090

      # OAuth credentials provider for CMF to authenticate to MDS
      confluent.metadata.http.auth.credentials.provider: OAUTHBEARER

      # Token endpoint for CMF to obtain its own tokens (internal cluster DNS)
      # Used when CMF needs to authenticate as a service principal
      confluent.metadata.oauthbearer.token.endpoint.url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token

      # CMF client credentials for authenticating to MDS
      confluent.metadata.oauthbearer.login.client.id: cmf
      confluent.metadata.oauthbearer.login.client.secret: cmf-secret

# Authorization configuration - connect to MDS for RBAC
  authorization:
    mdsRestConfig:
      # MDS endpoint on Kafka broker (internal cluster DNS). Left as
      # http:// here per Task 6's live-verification finding on whether
      # enabling services.mds.tls (Task 2) forces this to https:// for
      # every MDS client, not just CMF — adjust during Task 6 if so, and
      # ONLY after the stop-and-ask in Global Constraints has been
      # resolved, since flipping this affects erp/sr/c3 (#411) too.
      endpoint: http://kafka.kafka.svc.cluster.local:8090
      # mTLS authentication for CMF to talk to MDS (#412) - CMF's chart has
      # no bearer/LDAP option for this leg, see Epic #408's supportability
      # decision.
      authentication:
        type: mtls
        config:
          confluent.metadata.ssl.keystore.location: /mount/cmf-mtls/keystore.jks
          confluent.metadata.ssl.keystore.password: cmf-mtls-keystore-secret
          confluent.metadata.ssl.truststore.location: /mount/cmf-mtls/truststore.jks
          confluent.metadata.ssl.truststore.password: cmf-mtls-keystore-secret

  # UI login modes. cmf.authentication is already OAuth-configured against
  # Keycloak via the broker MDS above, using the same OIDC flow.
  ui:
    auth:
      basicAuthEnabled: false
      ssoEnabled: true

# Mount MDS token secret for public key validation of MDS-signed SSO tokens,
# and CMF's mTLS client certificate/keystore for its MDS authorization leg (#412).
mountedVolumes:
  volumes:
    - name: mds-token
      secret:
        secretName: mds-token
    - name: cmf-mds-mtls-client
      secret:
        secretName: cmf-mds-mtls-client
  volumeMounts:
    - name: mds-token
      mountPath: /mount/mds
    - name: cmf-mds-mtls-client
      mountPath: /mount/cmf-mtls
