# Confluent Manager for Apache Flink - flink-demo-rbac Cluster Overlay
#
# PROBE CONFIG: embedded MDS (cmf.authorization.authority: cmf) with an OIDC
# user store, to verify whether `Group:` role bindings are actually ENFORCED.
#
# Differences vs the previous cp-mds (broker-hosted MDS) config on this cluster:
#   - cmf.mds.* block added (embedded MDS server inside the CMF process)
#   - cmf.authorization.authority: cmf
#   - cmf.authorization.mdsRestConfig REMOVED ENTIRELY. Setting authority=cmf
#     with mdsRestConfig present makes CMF refuse to start with
#     "authority=cmf is incompatible with mdsRestConfig".
#     (docs-cp-flink installation/embedded-mds.rst:900-903)
#     Because this is a full values file applied with --reset-values (or via
#     ArgoCD, which always renders from scratch), the nested block is gone.
#   - cmf.ui.auth: basicAuthEnabled false / ssoEnabled true, because the
#     embedded MDS in OAUTH mode only VALIDATES IdP tokens, it never issues
#     them, so there is no Basic credential for it to check.

podAnnotations:
  cluster: flink-demo-rbac

# Debug logging for authorization troubleshooting. IO_CONFLUENT_RBAC is the one
# that prints principal + group resolution and the allow/deny decision, which is
# what the probe reads to tell "denied by RBAC" apart from "failed to authenticate".
env:
  - name: LOGGING_LEVEL_IO_CONFLUENT_CMF
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_RBAC
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_COMMON_SECURITY
    value: DEBUG
  - name: LOGGING_LEVEL_IO_CONFLUENT_SECURITY
    value: DEBUG

# Encryption key for CMF Secrets - Required for storing Flink SQL secret data
# CMF uses AES-GCM encryption to store spec.data in its metadata database
encryption:
  key:
    kubernetesSecretName: cmf-encryption-key
    kubernetesSecretProperty: key

cmf:
  # Enable stack traces in error responses for debugging authorization issues
  stackTraceLogging: true

  sql:
    examples-catalog:
      enabled: true

  # Database configuration - PostgreSQL. The embedded MDS stores its role
  # bindings in this same database, and derives its default cluster-id
  # (the CMF-id used in role-binding commands) from the database instance ID.
  database:
    type: jdbc
    jdbc:
      engine: postgresql
      database: cmf
      url: cmf-postgres.operator.svc.cluster.local
      user: cmf
      password:
        kubernetesSecretName: cmf-postgres-credentials
        kubernetesSecretProperty: POSTGRES_PASSWORD
      port: 5432
      options: ""

  # -------------------------------------------------------------------------
  # Embedded MDS server
  # -------------------------------------------------------------------------
  mds:
    enabled: true
    port: 8090
    authentication-method: BEARER

    # RSA keypair. Reuses the existing `mds-token` secret already generated on
    # this cluster by the mds-keygen job (keys: mdsTokenKeyPair.pem,
    # mdsPublicKey.pem), mounted at /mount/mds by mountedVolumes below.
    token-key-path: /mount/mds/mdsTokenKeyPair.pem
    public-key-path: /mount/mds/mdsPublicKey.pem

    # OAUTH user store: the embedded MDS only validates IdP-issued tokens.
    user-store: OAUTH

    # JWKS is fetched by CMF server-side, so it must use in-cluster DNS.
    # The external hostname does NOT resolve from inside the cluster.
    jwks-endpoint-url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs

    # expected-issuer is a string comparison against the token's `iss` claim,
    # which Keycloak stamps from KC_HOSTNAME - so it is the EXTERNAL url even
    # though the JWKS fetch above is internal. These two intentionally differ.
    expected-issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent

    # Principal name claim. Keycloak's `sub` is an opaque GUID; preferred_username
    # gives readable principals (user-square@osow.ski) for role bindings.
    # MUST match cmf.authentication.config.oauthbearer.sub.claim.name below, or
    # the API layer and the MDS layer compute different principals for one token.
    sub-claim-name: preferred_username

    # PROBE RESULT: this key is INERT in 2.4.1. Setting it alone does NOT make
    # `Group:` bindings resolve, and removing it while
    # cmf.authentication.config.oauthbearer.groups.claim.name is set changes
    # nothing. The load-bearing key is the oauthbearer one, below.
    # Kept set anyway: it is the documented key, it is schema-valid, and it
    # costs nothing if a later release wires it up. Do not rely on it.
    groups-claim-name: groups

    # Super-users bypass RBAC entirely. Semicolon-separated.
    # Needed to bootstrap the first role bindings.
    super-users: "User:admin@osow.ski"

    # OIDC SSO properties, for the CMF UI login and the confluent CLI device flow.
    # Backchannel endpoints use in-cluster DNS; `issuer` must stay the external
    # value so it matches the token claim.
    extra-configs:
      confluent.metadata.server.sso.mode: oidc
      confluent.oidc.idp.client.id: cmf
      confluent.oidc.idp.client.secret: cmf-secret
      confluent.oidc.idp.issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent
      confluent.oidc.idp.jwks.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs
      confluent.oidc.idp.authorize.base.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/auth
      confluent.oidc.idp.token.base.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token
      # Required for `confluent login --url <cmf-url>` device flow (probe step 7)
      confluent.oidc.idp.device.authorization.endpoint.uri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/auth/device

  # -------------------------------------------------------------------------
  # Authorization: embedded MDS. NOTE the absence of mdsRestConfig.
  # -------------------------------------------------------------------------
  authorization:
    authority: cmf
    # enforce defaults to true. Stated explicitly because enforce: false turns
    # the authorizer into allow-all, which would silently invalidate the entire
    # enforcement probe.
    enforce: true

  # -------------------------------------------------------------------------
  # CMF API authentication: validate Keycloak-issued bearer tokens
  # -------------------------------------------------------------------------
  authentication:
    type: oauth
    config:
      oauthbearer.jwks.endpoint.url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs
      oauthbearer.expected.issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent

      # Must agree with cmf.mds.sub-claim-name above.
      oauthbearer.sub.claim.name: preferred_username

      # LOAD-BEARING for `Group:` role bindings. This - not
      # cmf.mds.groups-claim-name - is what actually makes group RBAC work.
      # Remove it and every `Group:` binding silently stops matching while
      # `User:` bindings keep working. The embedded-MDS docs' own OIDC example
      # omits it, so a verbatim copy of that example cannot resolve groups.
      oauthbearer.groups.claim.name: groups

      # Audience check. Only exists at this API layer - there is NO audience key
      # in the cmf.mds.* reference table.
      # PROBE RESULT: this gates /cmf/api/v1/* ONLY. The MDS-proxied
      # /security/1.0/* surface (where role bindings are read AND written) does
      # NOT audience-check, so a token minted for another environment's
      # audience is still accepted there. Do not treat audience as the
      # prod/non-prod boundary; separate databases + distinct super-users are.
      oauthbearer.expected.audience: cmf

      token.issuer: Confluent
      public.key.path: /mount/mds/mdsPublicKey.pem

      # Points at the EMBEDDED MDS over loopback inside the pod, not at a broker.
      confluent.metadata.bootstrap.server.urls: http://localhost:8090
      confluent.metadata.http.auth.credentials.provider: OAUTHBEARER
      confluent.metadata.oauthbearer.token.endpoint.url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token
      confluent.metadata.oauthbearer.login.client.id: cmf
      confluent.metadata.oauthbearer.login.client.secret: cmf-secret

  kafka:
    oauthbearerAllowedUrls: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token,http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs,http://localhost:8090

  # The embedded MDS in OAUTH mode never issues tokens, so there is no Basic
  # credential to present. Browser users must be bounced to Keycloak.
  ui:
    auth:
      basicAuthEnabled: false
      ssoEnabled: true

# Mount the MDS RSA keypair (mds-token secret, reflected into `operator`)
mountedVolumes:
  volumes:
    - name: mds-token
      secret:
        secretName: mds-token
  volumeMounts:
    - name: mds-token
      mountPath: /mount/mds
      readOnly: true
