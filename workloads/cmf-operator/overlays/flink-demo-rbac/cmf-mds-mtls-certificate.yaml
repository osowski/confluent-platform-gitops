---
# Keystore/truststore password for the JKS files cert-manager generates
# below. Hardcoded in plaintext consistent with this chart's existing
# precedent for cmf-secret (the chart's mdsRestConfig.authentication.config
# is a free-form string map with no secretRef indirection — see
# values.yaml's confluent.metadata.oauthbearer.login.client.secret).
apiVersion: v1
kind: Secret
metadata:
  name: cmf-mds-mtls-keystore-password
  namespace: operator
type: Opaque
stringData:
  password: cmf-mtls-keystore-secret
---
# CMF's client certificate for its mTLS leg to MDS (#412). CN=cmf maps via
# the Kafka CR's services.mds.provider.mtls.principalMappingRules directly
# onto the existing User:cmf superuser identity - no new RBAC bindings
# needed. keystores.jks auto-generates keystore.jks/truststore.jks in the
# same Secret (cert-manager native feature, confirmed on the live
# certificates.cert-manager.io CRD) - CMF's Java MDS client config is
# JKS-oriented, avoiding a manual PEM->JKS conversion step.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cmf-mds-mtls-client
  namespace: operator
spec:
  commonName: cmf
  secretName: cmf-mds-mtls-client
  duration: 2160h     # 90 days
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - client auth
  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: cmf-mds-mtls-keystore-password
        key: password
  issuerRef:
    name: cmf-mds-mtls-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
