# Confluent Manager for Apache Flink (CMF) Configuration
# Base values - only overrides from chart defaults

# Resource requests - Lower than chart defaults for homelab efficiency
# Chart defaults: requests.cpu: 1, requests.memory: 2048Mi
# Chart defaults: limits.cpu: 2, limits.memory: 2048Mi (kept as-is)
resources:
  requests:
    cpu: 500m
    memory: 512Mi

## NOTE: cmf-operator does not seem to watch namespace-specific resources
# Namespaces to watch for Flink custom resources
# CMF watches only the flink namespace where Flink CRs are deployed
##namespaces:
##  - flink

# Custom service account name
# Chart default: auto-generated name
serviceAccount:
  name: cmf

# ---------------------------------------------------------------------------
# Artifact Management (Issue #306) — enabled by default on all clusters.
# Backed by the in-cluster RustFS (namespace `storage`). CMF uses these
# credentials only for artifact upload/download/delete; running Flink jobs
# fetch artifacts with their own per-deployment filesystem credentials.
# ---------------------------------------------------------------------------

# Inject RustFS credentials as AWS-style env vars. `rustfs-credentials` is
# reflected into the `operator` namespace by the Emberstack Reflector
# (see infrastructure/rustfs/overlays/*/secret-patch.yaml). Referenced as
# ${...} in cmf.artifacts.configuration below (resolved by CMF at runtime,
# NOT by Helm — values must arrive via valueFiles, never --set).
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: rustfs-credentials
        key: access-key
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-credentials
        key: secret-key

cmf:
  artifacts:
    enabled: true
    # Required when enabled — CMF refuses to start without basePath.
    basePath: s3://artifacts/cmf
    configuration:
      fs.s3a.endpoint: "http://rustfs.storage.svc.cluster.local:9000"
      fs.s3a.access.key: "${AWS_ACCESS_KEY_ID}"
      fs.s3a.secret.key: "${AWS_SECRET_ACCESS_KEY}"
      fs.s3a.path.style.access: "true"
      fs.s3a.connection.ssl.enabled: "false"

  sql:
    examples-catalog:
      enabled: true
    environmentCatalog:
      enabled: true

  # SQL compilation (see ADR 0022). Every compute pool runs Flink 2.3, so the
  # pod carries only the 2.3 shared compiler instead of the chart default of
  # 1.19 + 2.3 at 2Gi each. The compiler's -Xmx plus ~512Mi of JVM overhead must
  # fit in its memory limit, or an OOMKill takes the CMF API down with it.
  #
  # No compile workers: no statement uses CMF artifacts (USING JAR 'cmf://...'),
  # and the chart can only keep the workers' TLS Secrets stable across renders
  # with `lookup`, which Argo CD's `helm template` never resolves, so a worker
  # would rotate its CA and restart CMF on every sync. Statements that use
  # artifacts fail until workers are added with pre-created Secrets
  # (workers.tls.existingSecretPrefix).
  statementService:
    sharedCompilers:
      - version: "2.3"
        port: 8096
        jvmArgs: "-Xmx1g"
        resources:
          requests:
            cpu: 250m
            memory: 1536Mi
          limits:
            cpu: "1"
            memory: 1536Mi
    workers:
      count: 0
