---
# FlinkKafkaCatalog for the generic, single-tenant demo (CFK 3.3.0+, RFC 68)
#
# Replaces the `confluent flink catalog create` call previously made by the
# cmf-catalog-database-init PostSync hook Job.
#
# CR CHAIN: the Flink SQL resources form a strict dependency chain and must be
# applied in order (and deleted in reverse). Sync waves 5/40/45/50 express both
# directions, since ArgoCD deletes in reverse wave order:
#
#   FlinkEnvironment -> FlinkKafkaCatalog -> FlinkKafkaDatabase
#     -> FlinkComputePool -> FlinkStatement
#
# Custom Lua health checks in argocd-cm gate each wave on CFK's reconciliation
# against CMF (see docs/architecture.md's "Health assessment" section) — a
# failed catalog blocks the database and pool from advancing rather than
# racing ahead.
#
# flink-demo has no authentication on Kafka or Schema Registry, so the
# FlinkSecret and FlinkEnvironmentSecretMapping links are omitted here. On an
# authenticated cluster, `srInstance.connectionSecretId` would name a
# FlinkEnvironmentSecretMapping instead of leaving the SR client unauthenticated.
#
# NOTE: spec.flinkEnvironment is required and immutable, even though CMF
# catalogs are global. Sharing this catalog with a second environment requires a
# second CR rather than an edit.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkKafkaCatalog
metadata:
  name: kafka-cat
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  # The `default` FlinkEnvironment is defined in this same Application at
  # sync-wave 5, ahead of this catalog's wave 40.
  flinkEnvironment: default

  # Schema Registry instance backing this catalog's databases. Topics with
  # schemas registered here surface as Flink SQL tables.
  srInstance:
    connectionConfig:
      schema.registry.url: http://schemaregistry.kafka.svc.cluster.local:8081

  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
