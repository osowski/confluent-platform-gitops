# Registers the AI functions in the `default` environment's catalog
# (`_env_default`), from the JAR the setup Job uploaded as `ai-functions.jar`.
#
# Each statement is DDL: it settles to COMPLETED, and re-running it is a no-op
# because of IF NOT EXISTS. They run on the `pool` compute pool, so they sync
# after it (wave 50). `spec.statement` is immutable once running, so a change to
# either statement is a new CR with a versioned name.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: create-ai-forecast
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  flinkEnvironment: default
  computePoolName: pool
  properties:
    sql.current-catalog: _env_default
    sql.current-database: default
  statement: >-
    CREATE FUNCTION IF NOT EXISTS AI_FORECAST
    AS 'io.confluent.cpflink.udf.ai.AIForecastFunction'
    USING JAR 'cmf://default/ai-functions.jar';
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: create-ai-detect-anomalies
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  flinkEnvironment: default
  computePoolName: pool
  properties:
    sql.current-catalog: _env_default
    sql.current-database: default
  statement: >-
    CREATE FUNCTION IF NOT EXISTS AI_DETECT_ANOMALIES
    AS 'io.confluent.cpflink.udf.ai.AIDetectAnomaliesFunction'
    USING JAR 'cmf://default/ai-functions.jar';
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
