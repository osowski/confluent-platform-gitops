---
# FlinkComputePool for the generic, single-tenant demo (CFK 3.3.0+, RFC 68)
#
# Replaces the `confluent flink compute-pool create --environment default` call
# previously made by the cmf-compute-pool-init PostSync hook Job.
#
# ---------------------------------------------------------------------------
# IMPORTANT: FlinkStatement.spec.statement is immutable once running
# ---------------------------------------------------------------------------
# Statements run on this pool. If you add FlinkStatement CRs against it, be
# aware that the CRD carries a CEL validation rule:
#
#   rule:    self.statement == oldSelf.statement || oldSelf.statement == ''
#   message: statement is immutable once running
#
# Editing the SQL of a running statement in git therefore makes the ArgoCD sync
# fail permanently — the API server rejects the update, and retries never
# succeed. This is the easiest way to wedge a Flink SQL deployment, because the
# natural GitOps instinct (edit the manifest, commit, sync) is exactly what
# fails.
#
# To change the SQL, create a new CR with a versioned name — for example
# `myevent-agg-v2` — rather than editing in place. Two things that do NOT help:
#
#   * `spec.stopped: true` stops a statement without deleting it, but does not
#     unlock `spec.statement`.
#   * `argocd.argoproj.io/sync-options: Force=true,Replace=true` forces a
#     delete-and-recreate that does pass validation, but silently discards job
#     state. Prefer versioning the name so the change is explicit and auditable.
#
# See issue #326 for the full set of Flink SQL CR constraints.
# ---------------------------------------------------------------------------
#
# NOTE: spec.type is immutable after creation. spec.state (RUNNING/SUSPENDED)
# is valid only on SHARED pools and is rejected by a CEL rule on DEDICATED ones.
#
# NOTE: clusterSpec.image must match the deployed CMF version and the pool's
# flinkVersion, or the JobManager fails to load the statement plan; CMF does
# not check that the two agree. cp-flink-sql tags name the CMF minor version
# (2.3-cmf2.5-cp1 is the first Flink 2.3 build for CMF 2.5). flinkVersion is
# rejected on update while the pool has resumable statements.
#
# Flink 2.x config keys: state.backend.type takes hashmap/rocksdb/forst only
# (the legacy `filesystem` name is gone), and checkpoint/savepoint settings
# live under execution.checkpointing.*.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkComputePool
metadata:
  name: pool
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  type: DEDICATED
  flinkEnvironment: default

  clusterSpec:
    flinkVersion: v2_3
    image: confluentinc/cp-flink-sql:2.3-cmf2.5-cp1

    flinkConfiguration:
      # Chaining keeps each Kafka sink's writer and committer in one task, so
      # a committed transactional producer goes back to the writer's pool.
      # Unchained, the writer opens a new producer on every checkpoint and
      # never closes the old ones, and the TaskManager runs out of memory.
      pipeline.operator-chaining.enabled: "true"
      execution.checkpointing.interval: "10s"
      taskmanager.numberOfTaskSlots: "4"
      metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
      metrics.reporter.prom.port: "9249-9250"
      execution.checkpointing.dir: "s3://warehouse/checkpoints/"
      execution.checkpointing.savepoint-dir: "s3://warehouse/savepoints/"
      s3.endpoint: "http://rustfs.storage.svc.cluster.local:9000"
      s3.path.style.access: "true"
      s3.connection.ssl.enabled: "false"
      state.backend.type: "hashmap"
      execution.checkpointing.timeout: "600000"
      execution.checkpointing.min-pause: "5000"
      execution.checkpointing.max-concurrent-checkpoints: "1"
      high-availability.type: "kubernetes"
      high-availability.storageDir: "s3://warehouse/"
      execution.checkpointing.num-retained: "10"

    podTemplate:
      spec:
        restartPolicy: Always
        terminationGracePeriodSeconds: 30
        containers:
          - name: flink-main-container
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 9999
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: access-key
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: rustfs-credentials
                    key: secret-key

    # Both jobManager and taskManager resources must be specified, including
    # memory — CFK does not default them, and the pool fails to start without.
    taskManager:
      resource:
        cpu: 1.0
        memory: "1700m"

    jobManager:
      resource:
        cpu: 1
        memory: "1700m"

  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
