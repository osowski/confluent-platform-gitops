# REFERENCE: https://docs.confluent.io/operator/current/co-manage-flink.html#create-a-af-application
#
# Optional reference FlinkApplication demonstrating native Kubernetes deployment
# against the `default` FlinkEnvironment. Not required for Flink SQL usage.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: default-flink-app
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  flinkEnvironment: default
  image: confluentinc/cp-flink:1.20.3-cp2-java17
  flinkVersion: v1_20
  flinkConfiguration:
    "taskmanager.numberOfTaskSlots": "2"
    "metrics.reporter.prom.factory.class": "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    "metrics.reporter.prom.port": "9249-9250"
    "rest.profiling.enabled": "true"
  serviceAccount: flink
  jobManager:
    resource:
      memory: 1048m
      cpu: 1
  taskManager:
    resource:
      memory: 1048m
      cpu: 1
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    state: running
    parallelism: 3
    upgradeMode: stateless
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
