---
apiVersion: v1
kind: Service
metadata:
  name: model-server-ttm
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "90"
  labels:
    app: model-server-ttm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: model-server-ttm
