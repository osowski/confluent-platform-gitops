---
# Admits only pods labeled type: flink-native-kubernetes (Flink JobManagers and
# TaskManagers) from the flink, flink-colors and flink-shapes namespaces. The
# server has no auth. Takes effect only where the cluster's CNI enforces
# NetworkPolicy.
# namespaceSelector and podSelector share one `from` entry, so both must match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-server-ttm
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "90"
  labels:
    app: model-server-ttm
spec:
  podSelector:
    matchLabels:
      app: model-server-ttm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - flink
                  - flink-colors
                  - flink-shapes
          podSelector:
            matchLabels:
              type: flink-native-kubernetes
      ports:
        - protocol: TCP
          port: 8080
