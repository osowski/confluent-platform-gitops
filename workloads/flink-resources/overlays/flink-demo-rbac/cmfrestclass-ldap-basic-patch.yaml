# Overrides the shared oauth component's CMFRestClass Keycloak config
# (components/oauth/cmfrestclass-oauth-patch.yaml) for this cluster only.
# CMF's own authorization backend here is the embedded MDS (#418), which
# validates LDAP-backed credentials, not Keycloak-issued OAuth tokens
# (#422) — applied after the oauth component so this patch wins the merge.
# `type: basic` is schema-legal but rejected at CFK's own reconcile time
# ("authentication type basic is not supported", confirmed live); `bearer`
# is the supported alternative — same shape KafkaRestClass already uses.
apiVersion: platform.confluent.io/v1beta1
kind: CMFRestClass
metadata:
  name: cmf-rest-class
  namespace: flink
spec:
  cmfRest:
    authentication:
      type: bearer
      bearer:
        secretRef: cmf-rest-class-basic
      oauth: null
