# CFK-operator's MDS-bearer identity for its own client-credentials-style
# call to CMF's REST API (CMFRestClass), overriding the shared oauth
# component's Keycloak config for this cluster only. `authentication.type:
# basic` is schema-legal but rejected at the CFK operator's own reconcile
# time ("authentication type basic is not supported", #422) — `bearer` is
# the supported alternative, matching KafkaRestClass's existing bearer
# pattern (erp-mds-bearer): CFK exchanges this username/password for a JWT
# internally against MDS's authenticate endpoint. `admin` is CMF's
# embedded-MDS superuser (cmf.mds.super-users, workloads/cmf-operator/
# overlays/flink-demo-rbac/values.yaml) and is already a live-verified LDAP
# principal (#418) — CMF's embedded MDS scopes its LDAP user search to
# ou=users only, so this must be an ou=users principal, not a service
# principal under ou=services (#422).
apiVersion: v1
kind: Secret
metadata:
  name: cmf-rest-class-basic
  namespace: flink
type: Opaque
stringData:
  bearer.txt: |
    username=admin
    password=admin123
