# CFK-operator's Basic Auth identity for its own client-credentials-style
# call to CMF's REST API (CMFRestClass), overriding the shared oauth
# component's Keycloak config for this cluster only. `admin` is CMF's
# embedded-MDS superuser (cmf.mds.super-users, workloads/cmf-operator/
# overlays/flink-demo-rbac/values.yaml) and is already a live-verified LDAP
# principal (#418) — CMF's embedded MDS scopes its LDAP user search to
# ou=users only, so this must be an ou=users principal, not a service
# principal under ou=services (#422).
apiVersion: v1
kind: Secret
metadata:
  name: cmf-rest-class-basic
  namespace: flink
type: Opaque
stringData:
  basic.txt: |
    username=admin
    password=admin123
