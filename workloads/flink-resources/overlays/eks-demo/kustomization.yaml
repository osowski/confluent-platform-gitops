apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/oauth

patches:
  - path: model-server-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: model-server-ttm-cache

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    cluster: eks-demo
