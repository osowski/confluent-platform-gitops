# Strategic-merge patch adding Schema Registry Basic auth (#426) to the
# `default` FlinkEnvironment's flinkApplicationDefaults, used for CMF table
# auto-discovery - mirrors what colors-and-shapes' rbac-oauth component does
# for shapes-env/colors-env, using the `cmf` identity since `default` has no
# dedicated per-tenant service account. See flink-secret-default.yaml's
# default-cmf-sr-credentials comment for why this isn't OAuth bearer.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironment
metadata:
  name: default
  namespace: flink
spec:
  flinkApplicationDefaults:
    spec:
      flinkConfiguration:
        table.sql-catalog.confluent.schema-registry.basic.auth.credentials.source: "USER_INFO"
        table.sql-catalog.confluent.schema-registry.basic.auth.user.info: "cmf:cmf-secret"
