---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Layers CFK-operator OAuth (CMFRestClass) and a new OAuth-secured
# credential chain for the `default` FlinkEnvironment's Kafka SQL catalog/
# database onto the anonymous flink-resources base, for clusters that run
# Keycloak/MDS (flink-demo-rbac, flink-demo-rbac-mtls, eks-demo). Those
# clusters have no anonymous Kafka/SR listener, unlike flink-demo.

resources:
  - cfk-oauth-secret.yaml
  - flink-secret-default.yaml

patches:
  - path: cmfrestclass-oauth-patch.yaml
  - path: flink-environment-oauth-patch.yaml
  - path: flink-catalog-database-oauth-patch.yaml
  - path: flink-compute-pool-oauth-patch.yaml
