---
# CMF credential chain for the generic `default` environment's Flink SQL demo
# on RBAC clusters (no anonymous Kafka/SR listener here, unlike flink-demo).
#
# Unlike shapes/colors (which each have their own sa-<group>-flink Keycloak
# service account for Schema Registry auth), the `default` environment has no
# dedicated per-tenant identity - it's the generic, ungrouped demo. Both the
# Kafka and Schema Registry connections use the same `cmf` LDAP service
# account already used for CFK's own CMFRestClass client-credentials flow.
#
# Both legs below were still on Keycloak OAuth until #426 (the same
# stale-credential gap #413 already fixed for shapes/colors' Kafka leg, and
# #426 fixed for shapes/colors' Schema Registry leg, was never applied to
# `default` at all): the internal Kafka listener (port 9071) has been
# LDAP-direct-bind-only since #410, and Schema Registry has validated
# Basic/bearer credentials against MDS-backed RBAC since #411 - Keycloak
# tokens are foreign to both.
#
# NAMING IS CRITICAL - all THREE names must be identical:
#
#   FlinkSecret.metadata.name
#     == FlinkEnvironmentSecretMapping.metadata.name
#     == the connectionSecretId / connectionSecretRef that references them
#
# Two separate mechanisms enforce this, and only one of them is documented:
#
#   * CMF keys an environment's secrets by the mapping name, and silently
#     ignores a catalog whose connectionSecretId is unmapped rather than
#     returning an error.
#   * CFK resolves connectionSecretId to a FlinkSecret resource in the same
#     namespace. A mismatch fails reconciliation with
#     `flinksecret "<id>" not found in namespace`.
#
# Apply order is enforced by sync waves: Secret (10) -> FlinkSecret (20) ->
# FlinkEnvironmentSecretMapping (30) -> catalog (40) -> database (45).
apiVersion: v1
kind: Secret
metadata:
  name: default-cmf-kafka-credentials
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  security.protocol: "SASL_PLAINTEXT"
  sasl.mechanism: "PLAIN"
  sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"cmf\" password=\"cmf-secret\";"
---
apiVersion: v1
kind: Secret
metadata:
  name: default-cmf-sr-credentials
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  basic.auth.credentials.source: "USER_INFO"
  basic.auth.user.info: "cmf:cmf-secret"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-default
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: default-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-default
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: default-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-default
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: default
  secretRef:
    name: kafka-conn-secret-id-default
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-default
  namespace: flink
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: default
  secretRef:
    name: sr-conn-secret-id-default
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
