---
# Flink SQL statements (CFK 3.3.0+, RFC 68)
#
# Replaces step [7] of the sql-init hook Jobs, which GET-checked the statement,
# DELETEd it if it was FAILED, POSTed it, tolerated a 409, then polled the phase
# and failed the sync only on FAILED. All of that collapses into a CR whose
# status.phase ArgoCD now evaluates directly via the health check from #320.
#
# ---------------------------------------------------------------------------
# IMPORTANT: spec.statement is immutable once the statement is running
# ---------------------------------------------------------------------------
# The CRD carries a CEL validation rule:
#
#   rule:    self.statement == oldSelf.statement || oldSelf.statement == ''
#   message: statement is immutable once running
#
# Editing the SQL below and syncing will therefore FAIL PERMANENTLY - the API
# server rejects the update and no amount of retrying helps. This is the
# easiest way to wedge a Flink SQL deployment in this repository, because the
# natural GitOps instinct (edit, commit, sync) is exactly what breaks.
#
# To change the SQL, add a new CR with a versioned name - `shapes-sql-enrich-v2`
# - and remove the old one once it has drained. Two things that do NOT help:
#
#   * `spec.stopped: true` stops a statement without deleting it, but does not
#     unlock spec.statement.
#   * `argocd.argoproj.io/sync-options: Force=true,Replace=true` forces a
#     delete-and-recreate that passes validation but silently discards job
#     state, including savepoints.
#
# Versioning the name is preferred: explicit, auditable, and it leaves the
# previous statement's history intact.
#
# See docs/architecture.md for the full set of Flink SQL CR constraints.
# ---------------------------------------------------------------------------
#
# Both statements are continuous INSERT INTO enrichments reading the existing
# *-input topic (shared with the JAR FlinkApplications) and writing to the
# dedicated *-sql-output topic. An explicit column list leaves the inferred
# sink's leading raw `key` (BYTES) column NULL. SQL targets Flink 1.19
# (cp-flink-sql:1.19-cp8).

apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: shapes-sql-enrich
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: shapes-env
  computePoolName: shapes-pool
  properties:
    sql.current-catalog: shapes-catalog
    sql.current-database: shapes-database
  statement: >-
    INSERT INTO `shapes-sql-output`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`timestamp`, `type`, `location`, `value`, `status`, `id`, `encoded`, `error`, `original`)
    SELECT `timestamp`, `type`, `location`, `value`, `status`, `id`,
    TO_BASE64(ENCODE(CONCAT(`type`, '-', `location`), 'UTF-8')) AS `encoded`,
    CAST(NULL AS STRING) AS `error`, CAST(NULL AS STRING) AS `original`
    FROM `shapes-input`
    /*+ OPTIONS('properties.group.id' = 'shapes-sql-enrich') */;
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: colors-sql-enrich
  namespace: flink-colors
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  flinkEnvironment: colors-env
  computePoolName: colors-pool
  properties:
    sql.current-catalog: colors-catalog
    sql.current-database: colors-database
  statement: >-
    INSERT INTO `colors-sql-output`
    /*+ OPTIONS('kafka.producer.transaction.timeout.ms' = '900000') */
    (`timestamp`, `type`, `location`, `value`, `status`, `id`, `encoded`, `error`, `original`)
    SELECT `timestamp`, `type`, `location`, `value`, `status`, `id`,
    TO_BASE64(ENCODE(CONCAT(`type`, '-', `location`), 'UTF-8')) AS `encoded`,
    CAST(NULL AS STRING) AS `error`, CAST(NULL AS STRING) AS `original`
    FROM `colors-input`
    /*+ OPTIONS('properties.group.id' = 'colors-sql-enrich') */;
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
