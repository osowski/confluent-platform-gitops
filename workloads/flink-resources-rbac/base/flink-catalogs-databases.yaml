---
# Flink SQL catalogs and databases (CFK 3.3.0+, RFC 68)

# ---------------------------------------------------------------------------
# shapes
# ---------------------------------------------------------------------------
apiVersion: platform.confluent.io/v1beta1
kind: FlinkKafkaCatalog
metadata:
  name: shapes-catalog
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  # Required and immutable, even though CMF catalogs are global.
  flinkEnvironment: shapes-env
  srInstance:
    connectionConfig:
      schema.registry.url: "http://schemaregistry.kafka.svc.cluster.local:8081"
    # Must match the FlinkEnvironmentSecretMapping name exactly. If it does not,
    # CMF silently ignores this catalog instead of erroring.
    connectionSecretId: sr-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkKafkaDatabase
metadata:
  name: shapes-database
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  flinkEnvironment: shapes-env
  catalogRef:
    name: shapes-catalog
  kafkaCluster:
    connectionConfig:
      bootstrap.servers: "kafka.kafka.svc.cluster.local:9071"
  # Supplies the Kafka credentials CMF uses to validate the connection during
  # catalog registration. Must match the FlinkEnvironmentSecretMapping name.
  connectionSecretRef:
    name: kafka-conn-secret-id-shapes
  # Environments allowed to run DDL (CREATE TABLE and friends) against this
  # database. CMF rejects DDL from any environment not listed here.
  ddlEnvironments:
    - shapes-env
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink

