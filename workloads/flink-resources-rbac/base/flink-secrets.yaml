---
# CMF credential chain for Flink SQL.
#
# NAMING IS LOAD-BEARING - all THREE names must be identical:
#
#   FlinkSecret.metadata.name
#     == FlinkEnvironmentSecretMapping.metadata.name
#     == the connectionSecretId / connectionSecretRef that references them
#
# Two separate mechanisms enforce this, and only one of them is documented:
#
#   * CMF keys an environment's secrets by the mapping name, and silently
#     ignores a catalog whose connectionSecretId is unmapped rather than
#     returning an error.
#   * CFK resolves connectionSecretId to a FlinkSecret resource in the same
#     namespace. A mismatch fails reconciliation with
#     `flinksecret "<id>" not found in namespace`.
#
# Two credential pairs per environment, using deliberately different identities:
#
#   * Kafka -> the `cmf` service account. CMF validates the database connection
#     while registering a catalog and needs broader Kafka permissions than the
#     per-group accounts hold, which fail with "Catalog could not be created".
#     Do not "simplify" this to the per-group account.
#   * Schema Registry -> the per-group sa-<group>-flink service account.
#
# Apply order is enforced by sync waves: Secret (10) -> FlinkSecret (20) ->
# FlinkEnvironmentSecretMapping (30) -> catalog (40) -> database (50).

# ---------------------------------------------------------------------------
# shapes
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-kafka-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  security.protocol: "SASL_PLAINTEXT"
  sasl.mechanism: "OAUTHBEARER"
  sasl.oauthbearer.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  sasl.login.callback.handler.class: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler"
  sasl.jaas.config: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId='cmf' clientSecret='cmf-secret' scope='profile email';"
---
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-sr-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  bearer.auth.credentials.source: "OAUTHBEARER"
  bearer.auth.client.id: "sa-shapes-flink"
  bearer.auth.client.secret: "sa-shapes-flink-secret"
  bearer.auth.scope: "profile email"
  # Both endpoint keys are set: the standard Confluent SR client reads
  # `bearer.auth.issuer.endpoint.url`, the FlinkEnvironment's
  # `table.sql-catalog.confluent.schema-registry.*` block uses
  # `bearer.auth.token.endpoint.url`, and which one CMF's bundled SR client
  # honours is undocumented. The unused one is ignored.
  bearer.auth.issuer.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  bearer.auth.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: kafka-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: sr-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink

