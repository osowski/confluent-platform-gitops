---
# CMF credential chain for Flink SQL (CFK 3.3.0+, RFC 68)
#
# Replaces steps [1]-[3] of the sql-init hook Jobs: creating CMF Secrets via
# POST /cmf/api/v1/secrets, mapping them into an environment via
# POST /environments/{env}/secret-mappings, and minting a short-lived Schema
# Registry STATIC_TOKEN on every sync.
#
# THE STATIC_TOKEN WORKAROUND IS GONE. The old jobs embedded a freshly minted
# Keycloak access token directly in each catalog because CMF 2.2's embedded
# Schema Registry client did not accept OAUTHBEARER as a
# bearer.auth.credentials.source - which is why the jobs had to re-run on every
# sync to refresh a token that would otherwise expire. CMF 2.3.1 added
# OAUTHBEARER support for SR catalog authentication with automatic token
# refresh, and we run 2.4.0, so credentials are now a declarative FlinkSecret
# and CMF refreshes its own tokens.
#
# TWO credential pairs per environment, deliberately kept separate:
#
#   * Kafka  -> the `cmf` service account. CMF validates the database
#     connection during catalog registration and needs broader Kafka
#     permissions than the per-group service accounts have. This was
#     established by testing: `cmf` works, sa-<group>-flink fails with
#     "Catalog could not be created". Carried over from the ConfigMaps this
#     file replaces - do not "simplify" it to the per-group account.
#   * Schema Registry -> the per-group sa-<group>-flink service account, which
#     is what the hook Job used for its SR token and what the FlinkEnvironment
#     already uses for the Flink job's own SR catalog.
#
# NAMING IS LOAD-BEARING - all THREE names must be identical:
#
#   FlinkSecret.metadata.name
#     == FlinkEnvironmentSecretMapping.metadata.name
#     == the connectionSecretId / connectionSecretRef that references them
#
# Two separate mechanisms force this, and only one of them is documented:
#
#   * CMF keys an environment's secrets by the *mapping* name, and silently
#     ignores a catalog whose connectionSecretId is unmapped rather than
#     returning an error. This one the CFK docs state explicitly.
#   * CFK resolves connectionSecretId to a *FlinkSecret* resource in the same
#     namespace. Give the FlinkSecret a different name and reconciliation fails
#     with `flinksecret "<id>" not found in namespace`. The CFK docs never say
#     this; their example just happens to use one name for all three.
#
# Learned the hard way here: naming the FlinkSecrets sr-oauth-secret-* while
# the mappings were sr-conn-secret-id-* left both catalogs in ERROR/Failed.
#
# Apply order is enforced by sync waves: Secret (10) -> FlinkSecret (20) ->
# FlinkEnvironmentSecretMapping (30) -> catalog (40) -> database (50).

# ---------------------------------------------------------------------------
# shapes
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-kafka-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  security.protocol: "SASL_PLAINTEXT"
  sasl.mechanism: "OAUTHBEARER"
  sasl.oauthbearer.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  sasl.login.callback.handler.class: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler"
  sasl.jaas.config: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId='cmf' clientSecret='cmf-secret' scope='profile email';"
---
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-sr-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  bearer.auth.credentials.source: "OAUTHBEARER"
  bearer.auth.client.id: "sa-shapes-flink"
  bearer.auth.client.secret: "sa-shapes-flink-secret"
  bearer.auth.scope: "profile email"
  # Both endpoint keys are set on purpose. The standard Confluent SR client
  # reads `bearer.auth.issuer.endpoint.url`, while the FlinkEnvironment's
  # `table.sql-catalog.confluent.schema-registry.*` block in this same app uses
  # `bearer.auth.token.endpoint.url`. Which one CMF's bundled SR client honours
  # is not documented, so both are supplied; the unused one is ignored. Trim to
  # whichever proves necessary once verified against a live catalog.
  bearer.auth.issuer.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  bearer.auth.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
# Name must equal the database's connectionSecretRef - see header.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: kafka-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
# Name must equal the catalog's srInstance.connectionSecretId - see header.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: sr-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink

