---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  # RWO volume: the old pod must release it before the new one mounts it
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        accelerator: nvidia
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ollama
        env:
        - name: OLLAMA_NUM_PARALLEL
          value: "4"
        # Keep the model loaded on the GPU. The default 5m keep-alive unloads
        # it when idle, and the next calls wait on a cold load past the
        # agents' 30s timeout.
        - name: OLLAMA_KEEP_ALIVE
          value: "-1"
        resources:
          limits:
            nvidia.com/gpu: 1
