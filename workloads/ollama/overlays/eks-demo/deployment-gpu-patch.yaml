---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  # RWO volume: the old pod must release it before the new one mounts it
  strategy:
    type: Recreate
  template:
    spec:
      nodeSelector:
        accelerator: nvidia
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ollama
        env:
        - name: OLLAMA_NUM_PARALLEL
          value: "4"
        resources:
          limits:
            nvidia.com/gpu: 1
