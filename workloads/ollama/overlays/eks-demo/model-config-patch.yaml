# device-trust-mesh agents call qwen3:4b; qwen3:8b stays pulled so the agents
# can switch models in config alone. The PostSync ollama-model-pull Job pulls
# every model listed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-model-config
  namespace: ollama
data:
  models: |
    qwen3:4b
    qwen3:8b
