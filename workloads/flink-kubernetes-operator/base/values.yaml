# Flink Kubernetes Operator Configuration
# Base values - only overrides from chart defaults

# Limit operator to watch only flink namespace where Flink CRs are deployed
# Chart default: [] (all namespaces)
watchNamespaces:
  - flink

# Resource requests - Lower than chart defaults for homelab efficiency
# Chart defaults: requests.cpu: 2, requests.memory: 3Gi
# Chart defaults: limits.cpu: 2, limits.memory: 3Gi (kept as-is)
operatorPod:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

defaultConfiguration:
  create: true
  append: true
  flink-conf.yaml: |+
    # Pick up watchNamespaces changes from the ConfigMap without restarting
    # the operator. The chart has no ConfigMap checksum on the Deployment, so
    # without this a new namespace is only watched after a manual restart.
    kubernetes.operator.dynamic.namespaces.enabled: true

    # Prometheus metrics reporter - exposes metrics at /metrics endpoint
    kubernetes.operator.metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    kubernetes.operator.metrics.reporter.prom.port: 9999

    # SLF4J metrics reporter - logs detailed autoscaler metrics
    kubernetes.operator.metrics.reporter.slf4j.factory.class: org.apache.flink.metrics.slf4j.Slf4jReporterFactory
    kubernetes.operator.metrics.reporter.slf4j.interval: 5 MINUTE

metrics:
  port: 9999
