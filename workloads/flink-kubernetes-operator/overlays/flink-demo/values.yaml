# Flink Kubernetes Operator - flink-demo Cluster Overlay
# Cluster-specific configuration overrides

# Watch additional namespaces for the colors-and-shapes and device-trust-mesh demos
watchNamespaces:
  - flink
  - flink-shapes
  - flink-colors
  - device-trust-mesh

# Additional pod labels for flink-demo cluster
operatorPod:
  labels:
    cluster: flink-demo
