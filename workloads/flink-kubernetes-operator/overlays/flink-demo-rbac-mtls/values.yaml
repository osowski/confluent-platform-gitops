# Flink Kubernetes Operator - flink-demo-rbac-mtls Cluster Overlay
# Cluster-specific configuration overrides

# Watch additional namespaces for group-based Flink resources
watchNamespaces:
  - flink
  - flink-shapes
  - flink-colors
  - flink-secure-sql

# Additional pod labels for flink-demo-rbac-mtls cluster
operatorPod:
  labels:
    cluster: flink-demo-rbac-mtls
