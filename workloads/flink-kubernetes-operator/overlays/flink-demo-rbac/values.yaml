# Flink Kubernetes Operator - flink-demo-rbac Cluster Overlay
# Cluster-specific configuration overrides

# Watch additional namespaces for group-based Flink resources
watchNamespaces:
  - flink
  - flink-shapes
  - flink-colors

# Additional pod labels for flink-demo-rbac cluster
operatorPod:
  labels:
    cluster: flink-demo-rbac
