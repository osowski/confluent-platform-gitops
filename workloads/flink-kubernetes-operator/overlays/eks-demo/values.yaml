# Flink Kubernetes Operator - eks-demo Cluster Overlay
# Cluster-specific configuration overrides

# Watch additional namespaces for group-based Flink resources
watchNamespaces:
  - flink
  - flink-shapes
  - flink-colors
  - device-trust-mesh

# Additional pod labels for eks-demo cluster
operatorPod:
  labels:
    cluster: eks-demo
