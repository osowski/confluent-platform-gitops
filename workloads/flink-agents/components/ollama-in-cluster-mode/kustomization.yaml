---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Switches the Ollama endpoint from the native macOS host (the base default)
# to the in-cluster service. Used when Ollama runs as a Kubernetes Deployment
# rather than locally via `brew services`. Applies to both the init container
# health check and the main Flink container's OLLAMA_ENDPOINT env var.
patches:
  - target:
      kind: FlinkApplication
    patch: |-
      - op: replace
        path: /spec/podTemplate/spec/initContainers/0/env/0/value
        value: http://ollama.ollama.svc.cluster.local:11434
      - op: replace
        path: /spec/podTemplate/spec/containers/0/env/0/value
        value: http://ollama.ollama.svc.cluster.local:11434
