---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Listed in Flink SQL dependency-chain order; sync waves on each resource
# enforce the ordering at apply time, and reverse it on delete.
resources:
  - topics.yaml
  - schemas.yaml
  - flink-kafka-catalog.yaml
  - flink-kafka-database.yaml
  - flink-compute-pool.yaml
  - tmp-verify-statement.yaml
