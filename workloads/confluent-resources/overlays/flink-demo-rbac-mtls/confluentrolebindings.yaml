  namespace: kafka
spec:
  principal:
    type: group
    name: colors
  role: ResourceOwner
  resourcePatterns:
    - patternType: PREFIXED
      name: colors-
      resourceType: TransactionalId
  kafkaRestClassRef:
    name: default
---
