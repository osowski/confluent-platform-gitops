# ConfluentRoleBindings for CMF RBAC Authorization
# These role bindings grant permissions to users and groups for Flink resources
---
# CMF service account - SystemAdmin role on CMF cluster
# CMF itself needs admin permissions to manage Flink resources
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: cmf-systemadmin
  namespace: kafka
spec:
  principal:
    type: user
    name: cmf
  role: SystemAdmin
  clustersScopeByIds:
    cmfId: CMF-id
  kafkaRestClassRef:
    name: default
---
# Control Center service account - SystemAdmin role on CMF cluster for Flink UI access
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: controlcenter-cmf-systemadmin
  namespace: kafka
spec:
  principal:
    type: user
    name: controlcenter
  role: SystemAdmin
  clustersScopeByIds:
    cmfId: CMF-id
  kafkaRestClassRef:
    name: default
---
# Control Center service account - SystemAdmin role for Kafka cluster management
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: controlcenter-systemadmin
  namespace: kafka
spec:
  principal:
    type: user
    name: controlcenter
  role: SystemAdmin
  kafkaRestClassRef:
    name: default
---
# Admin user - SystemAdmin role on CMF cluster
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-systemadmin
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: SystemAdmin
  clustersScopeByIds:
    cmfId: CMF-id
  kafkaRestClassRef:
    name: default
---
# Admin user - ClusterAdmin role on CMF cluster
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-clusteradmin
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
  kafkaRestClassRef:
    name: default
---
# Admin user - SystemAdmin role on Kafka cluster for Control Center access
# This is IN ADDITION to the CMF-scoped bindings above
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-kafka-systemadmin
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: SystemAdmin
  # No clustersScopeByIds = defaults to Kafka cluster
  kafkaRestClassRef:
    name: default
---
# CMF service account - ClusterAdmin role on shapes-env FlinkEnvironment
# CMF needs environment-specific permissions to manage FlinkApplications
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: cmf-clusteradmin-shapes-env
  namespace: kafka
spec:
  principal:
    type: user
    name: cmf
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: shapes-env
  kafkaRestClassRef:
    name: default
---
# CMF service account - ClusterAdmin role on colors-env FlinkEnvironment
# CMF needs environment-specific permissions to manage FlinkApplications
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: cmf-clusteradmin-colors-env
  namespace: kafka
spec:
  principal:
    type: user
    name: cmf
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: colors-env
  kafkaRestClassRef:
    name: default
---
# Admin user - ClusterAdmin role on shapes-env FlinkEnvironment
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-clusteradmin-shapes-env
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: shapes-env
  kafkaRestClassRef:
    name: default
---
# Admin user - ClusterAdmin role on colors-env FlinkEnvironment
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-clusteradmin-colors-env
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: colors-env
  kafkaRestClassRef:
    name: default
---
# CMF service account - ClusterAdmin role on default FlinkEnvironment
# CMF needs environment-specific permissions to manage FlinkApplications
# (the cluster-wide cmf-systemadmin binding above does not, in practice,
# authorize FlinkApplication creation without this environment-scoped grant)
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: cmf-clusteradmin-default
  namespace: kafka
spec:
  principal:
    type: user
    name: cmf
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: default
  kafkaRestClassRef:
    name: default
---
# Admin user - ClusterAdmin role on default FlinkEnvironment
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: admin-clusteradmin-default
  namespace: kafka
spec:
  principal:
    type: user
    name: admin@osow.ski
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: default
  kafkaRestClassRef:
    name: default
---
# Shapes group - DeveloperManage on shapes-env FlinkEnvironment resource
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: shapes-developermanage-env
  namespace: kafka
spec:
  principal:
    type: group
    name: shapes
  role: DeveloperManage
  clustersScopeByIds:
    cmfId: CMF-id
  resourcePatterns:
    - patternType: LITERAL
      name: shapes-env
      resourceType: FlinkEnvironment
  kafkaRestClassRef:
    name: default
---
# Shapes group - ClusterAdmin on all FlinkApplications in shapes-env
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: shapes-clusteradmin-apps
  namespace: kafka
spec:
