      resourceType: Topic
  kafkaRestClassRef:
    name: default
---
# sa-colors-flink service account - ResourceOwner on colors-* topics
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: sa-colors-flink-topics-owner
  namespace: kafka
spec:
  principal:
