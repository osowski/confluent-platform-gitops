---
# Colors group - DeveloperManage on colors-env FlinkEnvironment resource
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: colors-developermanage-env
  namespace: kafka
spec:
  principal:
    type: group
    name: colors
  role: DeveloperManage
  clustersScopeByIds:
    cmfId: CMF-id
  resourcePatterns:
    - patternType: LITERAL
      name: colors-env
      resourceType: FlinkEnvironment
  kafkaRestClassRef:
    name: default
---
# Colors group - ClusterAdmin on all FlinkApplications in colors-env
apiVersion: platform.confluent.io/v1beta1
kind: ConfluentRolebinding
metadata:
  name: colors-clusteradmin-apps
  namespace: kafka
spec:
  principal:
    type: group
    name: colors
  role: ClusterAdmin
  clustersScopeByIds:
    cmfId: CMF-id
    flinkEnvironmentId: colors-env
  kafkaRestClassRef:
