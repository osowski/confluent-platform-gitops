# LDAP-backed client credentials for KafkaRestClass/SchemaRegistry/ControlCenter
# MDS/Kafka authentication (Epic #408 / Task #411). All three principals
# (erp, sr, c3) are seeded by workloads/openldap/base/seed-ldif-configmap.yaml
# (#409) — do not invent new LDAP identities here; if you need a distinct
# identity, add it to that LDIF first so both sides of the bind agree.
#
# Plaintext demo values committed to git, consistent with this cluster's
# existing convention (see ldap-client-secrets.yaml).
---
# KafkaRestClass's own bearer identity for its Admin REST / MDS role-binding
# management calls. Key/format per docs-operator co-authenticate-kafka.rst
# ("Create client-side Bearer credentials for MDS").
apiVersion: v1
kind: Secret
metadata:
  name: erp-mds-bearer
  namespace: kafka
type: Opaque
stringData:
  bearer.txt: |
    username=erp
    password=erp-secret
---
# Schema Registry's bearer identity for its own MDS session (RBAC token
# acquisition).
apiVersion: v1
kind: Secret
metadata:
  name: sr-mds-bearer
  namespace: kafka
type: Opaque
stringData:
  bearer.txt: |
    username=sr
    password=sr-secret
---
# Schema Registry's client-side SASL/PLAIN identity for its direct
# connection to the Kafka broker (Kafka's internal listener validates this
# against LDAP as of #410 — this is the client-side mirror of that).
apiVersion: v1
kind: Secret
metadata:
  name: sr-kafka-plain
  namespace: kafka
type: Opaque
stringData:
  plain.txt: |
    username=sr
    password=sr-secret
---
# Control Center's bearer identity for its own MDS session (RBAC token
# acquisition, and OIDC SSO stays separate/untouched — see ssoProtocol).
apiVersion: v1
kind: Secret
metadata:
  name: c3-mds-bearer
  namespace: kafka
type: Opaque
stringData:
  bearer.txt: |
    username=c3
    password=c3-secret
---
# Control Center's client-side SASL/PLAIN identity for its direct
# connection to the Kafka broker.
apiVersion: v1
kind: Secret
metadata:
  name: c3-kafka-plain
  namespace: kafka
type: Opaque
stringData:
  plain.txt: |
    username=c3
    password=c3-secret
---
# Control Center's HTTP Basic Auth identity for its connection to Schema
# Registry (ControlCenter.spec.dependencies.schemaRegistry.authentication
# has no `bearer` option — only basic/mtls/oauth — so Basic Auth carrying
# the same LDAP-registered c3 principal is the correct mechanism here).
apiVersion: v1
kind: Secret
metadata:
  name: c3-schemaregistry-basic
  namespace: kafka
type: Opaque
stringData:
  basic.txt: |
    username=c3
    password=c3-secret
