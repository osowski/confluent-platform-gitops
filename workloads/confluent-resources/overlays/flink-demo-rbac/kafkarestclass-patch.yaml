# ==============================================================================
# KafkaRestClass Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch adds bearer-token authentication to KafkaRestClass, which is
# required when the Kafka cluster has authentication enabled.
#
# KafkaRestClass is used by:
# - ConfluentRoleBindings for RBAC
# - MDS for role management
#
# Authenticates as the dedicated `erp` LDAP service principal (seeded by
# workloads/openldap/base/seed-ldif-configmap.yaml, #409) via MDS bearer
# token.
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: kafka
spec:
  kafkaRest:
    authentication:
      type: bearer
      bearer:
        secretRef: erp-mds-bearer
