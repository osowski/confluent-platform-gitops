# LDAP-backed credentials for CP-MDS RBAC (Epic #408 / Task #410). Both
# Secrets use the "kafka" service principal seeded by
# workloads/openldap/base/seed-ldif-configmap.yaml (#409) — do not invent a
# new LDAP user here; if you need a distinct identity, add it to that LDIF
# first so both sides of the bind agree.
#
# Plaintext demo values committed to git, consistent with this cluster's
# existing convention (see oauth-client-secrets.yaml).
---
# Inter-broker / controller-quorum SASL/PLAIN+LDAP bind credential.
# Key/format per docs-operator co-authenticate-kafka.rst:1424-1454
# ("Create server-side SASL/PLAIN LDAP credentials using JAAS config").
apiVersion: v1
kind: Secret
metadata:
  name: kafka-controller-interbroker
  namespace: kafka
type: Opaque
stringData:
  plain-interbroker.txt: |
    username=kafka
    password=kafka-secret
---
# Client-side Bearer credential Kafka's embedded kafkaRest dependency uses
# to authenticate to MDS's own /security/1.0/authenticate endpoint.
# Key/format per docs-operator co-authenticate-kafka.rst:1500-1521
# ("Create client-side Bearer credentials for MDS").
apiVersion: v1
kind: Secret
metadata:
  name: kafka-mds-bearer-client
  namespace: kafka
type: Opaque
stringData:
  bearer.txt: |
    username=kafka
    password=kafka-secret
