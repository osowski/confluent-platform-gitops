---
# Server certificate for Kafka's embedded MDS REST listener (port 8090),
# so CMF can authenticate to it via mTLS (#412). CN=kafka matches the
# existing broker/self-referential identity convention used elsewhere in
# this overlay (kafka-controller-interbroker) — MDS's own listener identity
# is not RBAC-relevant here (this cert only serves TLS; client identity for
# RBAC purposes comes from whoever presents a client cert, e.g. CMF in
# mds-server-mtls-certificate.yaml's sibling, cmf-mds-mtls-certificate.yaml
# in workloads/cmf-operator).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mds-server-mtls
  namespace: kafka
  annotations:
    # Issue ahead of the Kafka CR reconciliation that references this
    # secretRef, mirroring the flink-demo-rbac-mtls precedent
    # (mtls-certificates.yaml uses the same wave for the identical reason).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  commonName: kafka
  secretName: mds-server-mtls
  duration: 2160h     # 90 days
  renewBefore: 720h   # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - kafka.kafka.svc.cluster.local
    - "*.kafka.kafka.svc.cluster.local"
  issuerRef:
    name: cmf-mds-mtls-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
