# ==============================================================================
# Kafka Broker Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch consolidates all Kafka broker configuration including:
# - External NodePort listener configuration
# - Resource limits for local demo environment
# - MDS/RBAC configuration with LDAP provider
# - Broker-to-KRaft controller SASL/PLAIN with LDAP direct bind
# - Internal listener SASL/PLAIN with LDAP direct bind (self-referential
#   metadata-store client reading _confluent-metadata-auth)
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
  # ==============================================================================
  # EXTERNAL LISTENER - NodePort for kind cluster access
  # ==============================================================================
  # Enables external access via kind's port mapping:
  # - kind extraMappings: 31000-31002:31000-31002 (for 3 brokers)
  # - Bootstrap connection: kafka.flink-demo-rbac.confluentdemo.local:31000
  # - Requires /etc/hosts entry: 127.0.0.1 kafka.flink-demo-rbac.confluentdemo.local
  listeners:
    custom:
      - name: external-nodeport
        port: 9094
        externalAccess:
          type: nodePort
          nodePort:
            host: kafka.flink-demo-rbac.confluentdemo.local
            nodePortOffset: 31000
        tls:
          enabled: false

    # ==============================================================================
    # INTERNAL LISTENER - SASL/PLAIN with LDAP direct bind for inter-broker
    # communication. This listener (port 9071) is what the broker's own
    # self-referential RBAC metadata-store client (KafkaReader, reading
    # _confluent-metadata-auth) actually uses — matches the KRaft controller
    # listener's authentication shape below, not CFK's auto-added token
    # listener (port 9073, used by other CP components; see
    # dependencies.kafkaRest below).
    # ==============================================================================
    internal:
      authentication:
        type: ldap
        jaasConfig:
          secretRef: kafka-controller-interbroker

  # ==============================================================================
  # RESOURCE LIMITS - Tuned for 24GB total cluster memory
  # ==============================================================================
  podTemplate:
    resources:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        cpu: 2500m
        memory: 3Gi

  # ==============================================================================
  # AUTHORIZATION - RBAC with super users
  # ==============================================================================
  # `erp` (KafkaRestClass's identity, #411) is a static superuser rather
  # than a scoped ConfluentRolebinding like `sr`/`c3`: the CFK operator
  # authenticates as erp for every ConfluentRolebinding reconciliation
  # call, so erp's own privilege can't come from a rolebinding without a
  # bootstrap chicken-and-egg (it would need privilege to create the
  # binding that grants it privilege). Mirrors the existing `cmf` pattern,
  # which is also both a superuser AND has its own cmf-systemadmin
  # ConfluentRolebinding (see confluentrolebindings.yaml) — Kafka-cluster
  # superuser status doesn't extend to the separate CMF authorization
  # scope, which is why erp-cmf-systemadmin is still required alongside
  # this superuser entry.
  authorization:
    type: rbac
    superUsers:
      - User:admin@osow.ski
      - User:cmf
      - User:kafka
      - User:erp

  # ==============================================================================
  # MDS (METADATA SERVICE) - RBAC and SSO/OIDC configuration
  # ==============================================================================
  services:
    mds:
      # Token key pair for signing MDS authentication tokens
      tokenKeyPair:
        secretRef: mds-token

      # Provider configuration - LDAP for service account authentication,
      # plus SSO/OIDC for Control Center's browser-based login.
      #
      # `sso` lives *inside* `provider`, as a sibling of `ldap`/`oauth`/etc,
      # in the CFK 3.3.0 (chart 0.1718.10) CRD - NOT as a sibling of
      # `provider` itself. Confirmed by pulling the chart directly
      # (`helm pull confluentinc/confluent-for-kubernetes --version
      # 0.1718.10 --untar`) and inspecting
      # crds/platform.confluent.io_kafkas.yaml: sso only appears under
      # spec.services.mds.provider.properties.sso (and, separately, under
      # a new spec.identityProvider.sso - unused here). A prior attempt
      # placed `sso` as `services.mds.sso` (matching eks-demo's and
      # flink-demo-rbac-mtls's kafka-patch.yaml, both apparently written
      # against an older CFK schema) - Kubernetes structural-schema
      # pruning silently dropped it with no error, which is why the
      # /security/1.0/oidc/* endpoints C3 proxies under /api/metadata/*
      # kept 404ing even after that field was committed and synced.
      provider:
        ldap:
          address: ldap://openldap.openldap.svc.cluster.local:389
          authentication:
            type: simple
            simple:
              secretRef: mds-ldap-credential
          tls:
            enabled: false
          configurations:
            groupNameAttribute: cn
            groupObjectClass: groupOfNames
            groupMemberAttribute: member
            groupMemberAttributePattern: uid=(.*),ou=users,dc=confluentdemo,dc=local
            groupSearchBase: ou=groups,dc=confluentdemo,dc=local
            userNameAttribute: uid
            userMemberOfAttributePattern: cn=(.*),ou=groups,dc=confluentdemo,dc=local
            userObjectClass: inetOrgPerson
            userSearchBase: dc=confluentdemo,dc=local
        sso:
          enabled: true
          clientCredentials:
            secretRef: oidc-client-credentials
          configurations:
            groupsClaimName: groups
            subClaimName: email
            issuer: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent
            authorizeBaseEndpointUri: https://keycloak.flink-demo-rbac.confluentdemo.local/realms/confluent/protocol/openid-connect/auth
            jwksEndpointUri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/certs
            tokenBaseEndpointUri: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token
            refreshToken: false
            sessionTokenExpiry: 900000
            sessionMaxTimeout: 21600000

      # Impersonation settings for RBAC
      impersonation:
        admins:
          - User:kafka
          - User:krp                        # Kafka REST Proxy principal
          - User:cmf                        # CMF service principal for user authorization
          - User:admin@osow.ski             # Admin user from LDAP
        protectedUsers:
          - User:mds
          - User:superadmin

  # ==============================================================================
  # DEPENDENCIES - KRaft controller and Kafka REST authentication
  # ==============================================================================
  dependencies:
    # Broker-to-KRaft controller LDAP authentication
    kRaftController:
      controllerListener:
        authentication:
          type: ldap
          jaasConfig:
            secretRef: kafka-controller-interbroker
      clusterRef:
        name: kraftcontroller

    # Kafka REST (MDS) bearer token authentication
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: kafka-mds-bearer-client

  # ==============================================================================
  # CONFIGURATION OVERRIDES - LDAP search scope for cross-OU lookups
  # ==============================================================================
  # Confluent's LDAP client defaults ldap.user.search.scope to ONELEVEL (1),
  # but userSearchBase above is the tree root (dc=confluentdemo,dc=local) so
  # service principals under ou=services can be found alongside ou=users
  # entries — that requires a SUBTREE (2) search, which has no first-class
  # CRD field and must be set as a raw property override.
  configOverrides:
    server:
      - ldap.user.search.scope=2

