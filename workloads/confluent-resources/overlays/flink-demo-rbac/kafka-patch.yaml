# ==============================================================================
# Kafka Broker Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch consolidates all Kafka broker configuration including:
# - External NodePort listener configuration
# - Resource limits for local demo environment
# - MDS/RBAC configuration with OAuth provider (Keycloak)
# - SSO/OIDC configuration for browser-based authentication (Control Center)
# - Broker-to-KRaft controller OAuth authentication
# - Internal listener OAuth authentication
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
spec:
  # ==============================================================================
  # EXTERNAL LISTENER - NodePort for kind cluster access
  # ==============================================================================
  # Enables external access via kind's port mapping:
  # - kind extraMappings: 31000-31002:31000-31002 (for 3 brokers)
  # - Bootstrap connection: kafka.flink-demo-rbac.confluentdemo.local:31000
  # - Requires /etc/hosts entry: 127.0.0.1 kafka.flink-demo-rbac.confluentdemo.local
  listeners:
    custom:
      - name: external-nodeport
        port: 9094
        externalAccess:
          type: nodePort
          nodePort:
            host: kafka.flink-demo-rbac.confluentdemo.local
            nodePortOffset: 31000
        tls:
          enabled: false

    # ==============================================================================
    # INTERNAL LISTENER - Bearer token authentication for inter-broker communication
    # ==============================================================================
    internal:
      authentication:
        type: bearer

  # ==============================================================================
  # RESOURCE LIMITS - Tuned for 24GB total cluster memory
  # ==============================================================================
  podTemplate:
    resources:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        cpu: 2500m
        memory: 3Gi

  # ==============================================================================
  # AUTHORIZATION - RBAC with super users
  # ==============================================================================
  authorization:
    type: rbac
    superUsers:
      - User:admin@osow.ski
      - User:cmf
      - User:kafka

  # ==============================================================================
  # MDS (METADATA SERVICE) - RBAC and SSO/OIDC configuration
  # ==============================================================================
  services:
    mds:
      # Token key pair for signing MDS authentication tokens
      tokenKeyPair:
        secretRef: mds-token

      # Provider configuration - LDAP for service account authentication
      provider:
        ldap:
          address: ldap://openldap.openldap.svc.cluster.local:389
          authentication:
            type: simple
            simple:
              secretRef: mds-ldap-credential
          tls:
            enabled: false
          configurations:
            groupNameAttribute: cn
            groupObjectClass: groupOfNames
            groupMemberAttribute: member
            groupMemberAttributePattern: uid=(.*),ou=users,dc=confluentdemo,dc=local
            groupSearchBase: ou=groups,dc=confluentdemo,dc=local
            userNameAttribute: uid
            userMemberOfAttributePattern: cn=(.*),ou=groups,dc=confluentdemo,dc=local
            userObjectClass: inetOrgPerson
            userSearchBase: dc=confluentdemo,dc=local

      # Impersonation settings for RBAC
      impersonation:
        admins:
          - User:kafka
          - User:krp                        # Kafka REST Proxy principal
          - User:cmf                        # CMF service principal for user authorization
          - User:admin@osow.ski             # Admin user from Keycloak
        protectedUsers:
          - User:mds
          - User:superadmin

  # ==============================================================================
  # DEPENDENCIES - KRaft controller and Kafka REST authentication
  # ==============================================================================
  dependencies:
    # Broker-to-KRaft controller LDAP authentication
    kRaftController:
      controllerListener:
        authentication:
          type: ldap
          jaasConfig:
            secretRef: kafka-controller-interbroker
      clusterRef:
        name: kraftcontroller

    # Kafka REST (MDS) bearer token authentication
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: kafka-mds-bearer-client

  # ==============================================================================
  # CONFIGURATION OVERRIDES - Inter-broker SASL mechanism selector
  # ==============================================================================
  # CFK's provider.ldap + bearer-listener auto-configuration generates the
  # REPLICATION inter-broker listener as OAUTHBEARER-only but omits the
  # broker-level mechanism selector, so Kafka defaults it to GSSAPI and
  # fails startup validation. This overrides that default explicitly.
  configOverrides:
    server:
      - sasl.mechanism.inter.broker.protocol=OAUTHBEARER

