# ==============================================================================
# Schema Registry Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch consolidates all Schema Registry configuration including:
# - Resource limits for local demo environment
# - LDAP-backed authentication to Kafka (plain) and MDS (bearer), as the
#   dedicated `sr` LDAP service principal (seeded by
#   workloads/openldap/base/seed-ldif-configmap.yaml, #409)
# - RBAC authorization
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: kafka
spec:
  # ==============================================================================
  # RESOURCE LIMITS - Tuned for 24GB total cluster memory
  # ==============================================================================
  podTemplate:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ==============================================================================
  # AUTHORIZATION - RBAC
  # ==============================================================================
  authorization:
    type: rbac

  # ==============================================================================
  # DEPENDENCIES - Kafka (SASL/PLAIN+LDAP) and MDS (bearer) authentication
  # ==============================================================================
  dependencies:
    # Kafka connection with SASL/PLAIN, presenting the `sr` LDAP principal
    # (Kafka's internal listener validates this against LDAP as of #410)
    kafka:
      bootstrapEndpoint: kafka.kafka.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: sr-kafka-plain

    # MDS connection with bearer-token authentication (LDAP-backed as of
    # #410 — MDS validates the `sr` username/password against LDAP directly)
    mds:
      endpoint: http://kafka.kafka.svc.cluster.local:8090
      tokenKeyPair:
        secretRef: mds-token
      authentication:
        type: bearer
        bearer:
          secretRef: sr-mds-bearer
