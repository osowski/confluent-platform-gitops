# ==============================================================================
# Control Center Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch consolidates all Control Center configuration including:
# - Resource limits for local demo environment
# - ConfigOverrides (disable unused features, enable CMF)
# - LDAP-backed authentication to Kafka (plain), MDS (bearer), and Schema
#   Registry (basic), as the dedicated `c3` LDAP service principal (seeded
#   by workloads/openldap/base/seed-ldif-configmap.yaml, #409)
# - RBAC authorization
# - OIDC SSO for browser-based user authentication (still Keycloak — #414)
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: kafka
spec:
  # ==============================================================================
  # RESOURCE LIMITS - Tuned for 24GB total cluster memory
  # ==============================================================================
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 2Gi

  # ==============================================================================
  # CONFIGURATION OVERRIDES - Feature enablement
  # ==============================================================================
  configOverrides:
    server:
      # Disable unused features
      - confluent.controlcenter.ksql.enable=false
      - confluent.controlcenter.connect.enable=false
      - confluent.controlcenter.ui.replicator.monitoring.enable=false
      # Enable CMF (Confluent Manager for Apache Flink)
      - confluent.controlcenter.cmf.enable=true
      - confluent.controlcenter.cmf.url=http://cmf-service.operator.svc.cluster.local:80

  # ==============================================================================
  # AUTHORIZATION - RBAC
  # ==============================================================================
  authorization:
    type: rbac

  # ==============================================================================
  # DEPENDENCIES - Kafka, MDS, and Schema Registry with LDAP-backed authentication
  # ==============================================================================
  dependencies:
    # Remove connect and ksqldb dependencies (disabled features)
    connect: null
    ksqldb: null

    # Kafka connection with SASL/PLAIN, presenting the `c3` LDAP principal
    kafka:
      bootstrapEndpoint: kafka.kafka.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: c3-kafka-plain

    # MDS connection with bearer-token authentication AND OIDC SSO enablement
    mds:
      # Enable OIDC SSO protocol for browser-based user authentication
      # (unchanged — stays on Keycloak until #414)
      ssoProtocol: oidc
      # MDS endpoint (internal)
      endpoint: http://kafka.kafka.svc.cluster.local:8090
      # Token key pair for MDS authentication (shared public key)
      tokenKeyPair:
        secretRef: mds-token
      # Control Center service account authentication to MDS (bearer, LDAP-backed)
      authentication:
        type: bearer
        bearer:
          secretRef: c3-mds-bearer

    # Schema Registry connection with HTTP Basic Auth (LDAP-backed) — no
    # `bearer` option exists in this field's schema (basic/mtls/oauth only)
    schemaRegistry:
      url: http://schemaregistry.kafka.svc.cluster.local:8081
      authentication:
        type: basic
        basic:
          secretRef: c3-schemaregistry-basic
