# ==============================================================================
# KRaft Controller Configuration for flink-demo-rbac Cluster
# ==============================================================================
# This patch consolidates all KRaft controller configuration including:
# - Resource limits for local demo environment
# - SASL/PLAIN with LDAP direct bind for controller quorum communication
# - identityProvider.ldap for the controller's own LDAP search/bind identity
# NOTE: Authorization intentionally omitted to avoid circular dependency with Kafka MDS.
#       Controllers are an internal control plane — principals connecting to them (kafka brokers)
#       are already super users. Fine-grained RBAC adds no practical security benefit here.
#       Because authorization.type: rbac is not set here, identityProvider (below) is the
#       live LDAP config path for this CR, not services.mds.provider (co-authenticate-kafka.rst:278-280).
# ==============================================================================
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: kafka
spec:
  # ==============================================================================
  # RESOURCE LIMITS - Tuned for 24GB total cluster memory
  # ==============================================================================
  podTemplate:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

  # ==============================================================================
  # CONTROLLER LISTENER - SASL/PLAIN with LDAP direct bind for quorum communication
  # ==============================================================================
  listeners:
    controller:
      authentication:
        type: ldap
        jaasConfig:
          secretRef: kafka-controller-interbroker

  # ==============================================================================
  # IDENTITY PROVIDER - LDAP search/bind identity for this controller
  # ==============================================================================
  identityProvider:
    type: ldap
    ldap:
      address: ldap://openldap.openldap.svc.cluster.local:389
      authentication:
        type: simple
        simple:
          secretRef: mds-ldap-credential
      tls:
        enabled: false
      configurations:
        groupNameAttribute: cn
        groupObjectClass: groupOfNames
        groupMemberAttribute: member
        groupMemberAttributePattern: uid=(.*),ou=users,dc=confluentdemo,dc=local
        groupSearchBase: ou=groups,dc=confluentdemo,dc=local
        userNameAttribute: uid
        userMemberOfAttributePattern: cn=(.*),ou=groups,dc=confluentdemo,dc=local
        userObjectClass: inetOrgPerson
        userSearchBase: dc=confluentdemo,dc=local
