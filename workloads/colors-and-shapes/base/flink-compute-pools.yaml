---
# Flink SQL compute pools (CFK 3.3.0+, RFC 68)
#
# NOTE: clusterSpec.image must match the deployed CMF version. cp-flink-sql
# 1.19-cp7 is the documented floor for CMF 2.3.x/2.4.x; earlier tags fail
# statement plan loading with a `key.format requires ... confluent.key.fields`
# error. Pinned to 1.19-cp10 (above the floor) because cp8 silently ignores
# a FlinkApplication's --user-jar-uris — UDFs never load, with no error —
# which cp10 fixes.

apiVersion: platform.confluent.io/v1beta1
kind: FlinkComputePool
metadata:
  name: shapes-pool
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  type: DEDICATED
  flinkEnvironment: shapes-env
  clusterSpec:
    flinkVersion: v1_19
    image: confluentinc/cp-flink-sql:1.19-cp10
    flinkConfiguration:
      taskmanager.numberOfTaskSlots: "2"
      metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
      metrics.reporter.prom.port: "9249-9250"
      pipeline.operator-chaining.enabled: "false"
      execution.checkpointing.interval: "10s"
      state.checkpoints.dir: "s3://warehouse/checkpoints/shapes/"
      state.savepoints.dir: "s3://warehouse/savepoints/shapes/"
      s3.endpoint: "http://minio.storage.svc.cluster.local:9000"
      s3.path.style.access: "true"
      s3.connection.ssl.enabled: "false"
      state.backend: "filesystem"
      state.checkpoints.timeout: "600000"
      execution.checkpointing.min-pause: "5000"
      execution.checkpointing.max-concurrent-checkpoints: "1"
      high-availability.type: "kubernetes"
      high-availability.storageDir: "s3://warehouse/ha/shapes/"
      state.checkpoints.num-retained: "10"
    podTemplate:
      spec:
        restartPolicy: Always
        terminationGracePeriodSeconds: 30
        containers:
          - name: flink-main-container
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 9999
            env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: minio-credentials
                    key: root-user
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-credentials
                    key: root-password
    taskManager:
      resource:
        cpu: 1.0
        memory: "1700m"
    jobManager:
      resource:
        cpu: 1
        memory: "1700m"
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
