# Registers the AI functions in the `colors-env` and `shapes-env` environments'
# catalogs (`_env_colors-env`, `_env_shapes-env`), from the JAR each setup Job
# uploaded as `ai-functions.jar`.
#
# Each statement is DDL: it settles to COMPLETED, and re-running it is a no-op
# because of IF NOT EXISTS. They run on the environment's compute pool, so they
# sync after the pools (wave 60) and after the setup Jobs (wave 82).
# `spec.statement` is immutable once running, so a change to a statement is a
# new CR with a versioned name. With IF NOT EXISTS a new CR is a no-op while the
# function is still registered, so changing the class or the JAR also needs a
# DROP FUNCTION first.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
  name: create-ai-forecast
  namespace: flink-colors
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  flinkEnvironment: colors-env
  computePoolName: colors-pool
  properties:
    sql.current-catalog: _env_colors-env
    sql.current-database: default
  statement: >-
    CREATE FUNCTION IF NOT EXISTS AI_FORECAST
    AS 'io.confluent.cpflink.udf.ai.AIForecastFunction'
    USING JAR 'cmf://colors-env/ai-functions.jar';
  parallelism: 1
  stopped: false
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkStatement
metadata:
