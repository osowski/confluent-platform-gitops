# FlinkApplication for the shapes group demo tenant - Kafka-connected
# Deployed in flink-shapes namespace
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "80"
spec:
  # Reference to FlinkEnvironment
  flinkEnvironment: shapes-env

  # Reference to CMFRestClass for CMF communication
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink

  # Flink version
  flinkVersion: v2_1

  # Flink Docker image with bundled application JAR
  # Multi-arch (amd64/arm64), so every cluster consumes this pin directly.
  # The JAR reads and writes Avro via Schema Registry; a JSON-only build makes the
  # job emit an error record per event without ever leaving RUNNING (see issue #341).
  # Tag is the flink-sandbox commit the JAR was built from.
  image: quay.io/osowski/flink-kafka-demo:v1.1.0-202609042223

  # ServiceAccount for Kubernetes RBAC
  serviceAccount: flink

  # JobManager configuration
  jobManager:
    replicas: 1
    resource:
      memory: "1048m"
      cpu: "1"

  # TaskManager configuration
  taskManager:
    resource:
      memory: "1048m"
      cpu: "1"
    replicas: 2

  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-hadoop-2.2.0-cp2.jar"
            # Kafka topic configuration for application
            - name: KAFKA_TOPIC
              value: shapes-input
            - name: KAFKA_OUTPUT_TOPIC
              value: shapes-output
            # Schema Registry URL
            - name: SCHEMA_REGISTRY_URL
              value: "http://schemaregistry.kafka.svc.cluster.local:8081"
            # S3 credentials from reflected secret
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password

  # Flink configuration
  flinkConfiguration:
    # Kafka bootstrap servers (internal listener)
    kafka.bootstrap.servers: kafka.kafka.svc.cluster.local:9071

    # Schema Registry configuration for Avro serialization/deserialization
    schema.registry.url: "http://schemaregistry.kafka.svc.cluster.local:8081"

    # Consumer configuration
    kafka.consumer.group.id: shapes-autoscaler
    kafka.consumer.auto.offset.reset: earliest

    # Producer configuration
    kafka.producer.transaction.timeout.ms: "900000"

    # Application-specific topic configuration
    kafka.input.topic: shapes-input
    kafka.output.topic: shapes-output

    # Flink autoscaling configuration (disabled for this demo environment)
    kubernetes.operator.job.autoscaler.enabled: "false"

    # Flink task slots
    taskmanager.numberOfTaskSlots: "2"

    # Restart strategy for fault tolerance
    # fixed-delay will restart the job a fixed number of times with a delay between attempts
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "10s"

    # Prometheus metrics
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249-9250"

    # Checkpointing configuration
    execution.checkpointing.interval: "10s"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: "5s"
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.timeout: "600000"

    # State backend configuration
    state.backend: hashmap
    state.checkpoints.dir: "s3://warehouse/checkpoints/shapes"
    state.savepoints.dir: "s3://warehouse/savepoints/shapes"
    state.checkpoints.num-retained: "10"

    # S3 configuration (points to MinIO service)
    s3.endpoint: "http://minio.storage.svc.cluster.local:9000"
    s3.path.style.access: "true"
    s3.connection.ssl.enabled: "false"

    # High availability configuration
    high-availability.type: kubernetes
    high-availability.storageDir: "s3://warehouse/ha/shapes"

  # Job configuration
  job:
    # JAR location (bundled in container image)
    jarURI: local:///opt/flink/usrlib/kafka-flink-job.jar

    # Parallelism
    parallelism: 2

    # Upgrade mode (stateless for first deployment)
    upgradeMode: stateless

    # Job state
    state: running

    # Application arguments
    args: []
