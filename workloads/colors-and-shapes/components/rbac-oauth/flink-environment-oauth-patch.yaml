apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironment
metadata:
  name: shapes-env
  namespace: flink-shapes
spec:
  flinkApplicationDefaults:
    spec:
      flinkConfiguration:
        # Schema Registry Basic auth (#426) — see flink-secrets.yaml's
        # shapes-cmf-sr-credentials comment for why this isn't OAuth bearer.
        table.sql-catalog.confluent.schema-registry.basic.auth.credentials.source: "USER_INFO"
        table.sql-catalog.confluent.schema-registry.basic.auth.user.info: "cmf:cmf-secret"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironment
metadata:
  name: colors-env
  namespace: flink-colors
spec:
  flinkApplicationDefaults:
    spec:
      flinkConfiguration:
        # Schema Registry Basic auth (#426) — see flink-secrets.yaml's
        # colors-cmf-sr-credentials comment for why this isn't OAuth bearer.
        table.sql-catalog.confluent.schema-registry.basic.auth.credentials.source: "USER_INFO"
        table.sql-catalog.confluent.schema-registry.basic.auth.user.info: "cmf:cmf-secret"
