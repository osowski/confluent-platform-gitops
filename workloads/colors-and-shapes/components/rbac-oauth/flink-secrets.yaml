---
# CMF credential chain for Flink SQL.
#
# NAMING IS CRITICAL - all THREE names must be identical:
#
#   FlinkSecret.metadata.name
#     == FlinkEnvironmentSecretMapping.metadata.name
#     == the connectionSecretId / connectionSecretRef that references them
#
# Two separate mechanisms enforce this, and only one of them is documented:
#
#   * CMF keys an environment's secrets by the mapping name, and silently
#     ignores a catalog whose connectionSecretId is unmapped rather than
#     returning an error.
#   * CFK resolves connectionSecretId to a FlinkSecret resource in the same
#     namespace. A mismatch fails reconciliation with
#     `flinksecret "<id>" not found in namespace`.
#
# Two credential pairs per environment, using deliberately different identities:
#
#   * Kafka -> the `cmf` service account, authenticated via SASL/PLAIN
#     against the LDAP-backed internal listener (kafka.kafka.svc.cluster.local:9071,
#     port 9071 wraps to LDAP direct-bind PLAIN as of #410). CMF validates
#     the database connection while registering a catalog and needs broader
#     Kafka permissions than the per-group accounts hold, which fail with
#     "Catalog could not be created". Do not "simplify" this to the
#     per-group account.
#   * Schema Registry -> the `cmf` service account via HTTP Basic auth
#     directly against Schema Registry (unrelated to the Kafka broker
#     listener above). Schema Registry runs with `authorization.type: rbac`
#     (MDS-backed, since #411) and validates Basic credentials against MDS
#     the same way it validates bearer tokens — confirmed live via
#     `curl -u cmf:cmf-secret http://schemaregistry.../subjects` -> 200.
#     The per-group `sa-<group>-flink` Keycloak service accounts this used
#     before #426 were never updated when SR moved to MDS-backed RBAC in
#     #411, so their Keycloak-issued tokens were cryptographically foreign
#     to MDS's trust store — the same trust-mismatch class of bug as #422.
#     Reusing the broad `cmf` account (rather than seeding new per-group
#     LDAP principals) matches how the Kafka leg above already works;
#     narrower per-group SR scoping remains a possible future refinement,
#     not a correctness requirement.
#
# Apply order is enforced by sync waves: Secret (10) -> FlinkSecret (20) ->
# FlinkEnvironmentSecretMapping (30) -> catalog (40) -> database (50).

# ---------------------------------------------------------------------------
# shapes
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-kafka-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  security.protocol: "SASL_PLAINTEXT"
  sasl.mechanism: "PLAIN"
  sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"cmf\" password=\"cmf-secret\";"
---
apiVersion: v1
kind: Secret
metadata:
  name: shapes-cmf-sr-credentials
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  basic.auth.credentials.source: "USER_INFO"
  basic.auth.user.info: "cmf:cmf-secret"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: shapes-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: kafka-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-shapes
  namespace: flink-shapes
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: shapes-env
  secretRef:
    name: sr-conn-secret-id-shapes
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink

