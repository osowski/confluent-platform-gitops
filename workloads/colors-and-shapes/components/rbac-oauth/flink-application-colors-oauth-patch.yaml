# Strategic-merge patch - see flink-application-shapes-oauth-patch.yaml for
# why this carries the full superset rather than just the OAuth additions.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: colors
  namespace: flink-colors
spec:
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-hadoop-2.2.0-cp2.jar"
            - name: KAFKA_TOPIC
              value: colors-input
            - name: KAFKA_OUTPUT_TOPIC
              value: colors-output
            - name: SCHEMA_REGISTRY_URL
              value: "http://schemaregistry.kafka.svc.cluster.local:8081"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: KAFKA_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: colors-flink-oauth
                  key: client-id
            - name: KAFKA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: colors-flink-oauth
                  key: client-secret
  flinkConfiguration:
    # LDAP-backed SASL/PLAIN against the internal listener (port 9071,
    # LDAP-only - OAUTHBEARER is not a supported mechanism on it). Schema
    # Registry uses HTTP Basic against the same LDAP identity; its RBAC
    # authorization validates Basic credentials the same way it validates
    # bearer tokens.
    #
    # TODO: the jaas.config/basic.auth.user.info values below are inline
    # plaintext credentials. flinkConfiguration is a flat string map with
    # no secretKeyRef support, so removing this requires either CFK
    # support for secret-backed config values or an external
    # secret-injection mechanism - not yet in place.
    kafka.bootstrap.servers: kafka.kafka.svc.cluster.local:9071
    kafka.security.protocol: SASL_PLAINTEXT
    kafka.sasl.mechanism: PLAIN
    kafka.sasl.jaas.config: |
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="sa-colors-flink"
      password="sa-colors-flink-secret";
    schema.registry.url: "http://schemaregistry.kafka.svc.cluster.local:8081"
    schema.registry.basic.auth.credentials.source: "USER_INFO"
    schema.registry.basic.auth.user.info: "sa-colors-flink:sa-colors-flink-secret"
    kafka.consumer.group.id: colors-autoscaler
    kafka.consumer.auto.offset.reset: earliest
    kafka.producer.transaction.timeout.ms: "900000"
    kafka.input.topic: colors-input
    kafka.output.topic: colors-output
    kubernetes.operator.job.autoscaler.enabled: "false"
    taskmanager.numberOfTaskSlots: "2"
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "10s"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249-9250"
    execution.checkpointing.interval: "10s"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: "5s"
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.timeout: "600000"
    state.backend: hashmap
    state.checkpoints.dir: "s3://warehouse/checkpoints/colors"
    state.savepoints.dir: "s3://warehouse/savepoints/colors"
    state.checkpoints.num-retained: "10"
    s3.endpoint: "http://minio.storage.svc.cluster.local:9000"
    s3.path.style.access: "true"
    s3.connection.ssl.enabled: "false"
    high-availability.type: kubernetes
    high-availability.storageDir: "s3://warehouse/ha/colors"
