# Strategic-merge patch carrying the complete desired podTemplate env and
# flinkConfiguration for this FlinkApplication - not just the OAuth fields
# added on top of base. This CRD has no patchMergeKey metadata for the env
# array, so a merge patch replaces it wholesale with whatever is listed
# here; writing the full superset (base's fields plus OAuth) makes that
# replacement correct by construction, and keeps the whole resulting spec
# readable in one place instead of scattered add-ops.
apiVersion: platform.confluent.io/v1beta1
kind: FlinkApplication
metadata:
  name: shapes
  namespace: flink-shapes
spec:
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: "flink-s3-fs-hadoop-2.2.0-cp2.jar"
            - name: KAFKA_TOPIC
              value: shapes-input
            - name: KAFKA_OUTPUT_TOPIC
              value: shapes-output
            - name: SCHEMA_REGISTRY_URL
              value: "http://schemaregistry.kafka.svc.cluster.local:8081"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: KAFKA_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: shapes-flink-oauth
                  key: client-id
            - name: KAFKA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shapes-flink-oauth
                  key: client-secret
  flinkConfiguration:
    # This JAR uses the plain (unshaded) kafka-clients and Schema Registry
    # client libraries directly, unlike the CFK-managed Flink SQL statements
    # sharing this namespace's compute pool - so its OAUTHBEARER
    # token-endpoint allow-list needs the unshaded system property, not the
    # shaded one ADR-0008 documents for the compute pool. See ADR-0013.
    env.java.opts.all: "-Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
    kafka.bootstrap.servers: kafka.kafka.svc.cluster.local:9071
    kafka.security.protocol: SASL_PLAINTEXT
    kafka.sasl.mechanism: OAUTHBEARER
    kafka.sasl.jaas.config: |
      org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
      clientId="sa-shapes-flink"
      clientSecret="sa-shapes-flink-secret"
      tokenEndpointUri="http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token";
    kafka.sasl.login.callback.handler.class: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
    kafka.sasl.oauthbearer.token.endpoint.url: http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token
    schema.registry.url: "http://schemaregistry.kafka.svc.cluster.local:8081"
    schema.registry.bearer.auth.credentials.source: "OAUTHBEARER"
    schema.registry.bearer.auth.issuer.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
    schema.registry.bearer.auth.client.id: "sa-shapes-flink"
    schema.registry.bearer.auth.client.secret: "sa-shapes-flink-secret"
    schema.registry.bearer.auth.scope: ""
    schema.registry.bearer.auth.logical.cluster: ""
    schema.registry.bearer.auth.identity.pool.id: ""
    kafka.consumer.group.id: shapes-autoscaler
    kafka.consumer.auto.offset.reset: earliest
    kafka.producer.transaction.timeout.ms: "900000"
    kafka.input.topic: shapes-input
    kafka.output.topic: shapes-output
    kubernetes.operator.job.autoscaler.enabled: "false"
    taskmanager.numberOfTaskSlots: "2"
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "10s"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249-9250"
    execution.checkpointing.interval: "10s"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.min-pause: "5s"
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.timeout: "600000"
    state.backend: hashmap
    state.checkpoints.dir: "s3://warehouse/checkpoints/shapes"
    state.savepoints.dir: "s3://warehouse/savepoints/shapes"
    state.checkpoints.num-retained: "10"
    s3.endpoint: "http://minio.storage.svc.cluster.local:9000"
    s3.path.style.access: "true"
    s3.connection.ssl.enabled: "false"
    high-availability.type: kubernetes
    high-availability.storageDir: "s3://warehouse/ha/shapes"
