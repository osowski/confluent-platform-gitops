---
# Custom bootstrap ACL applied by osixia/openldap's entrypoint on every fresh
# boot (config volume is emptyDir — see README's Cleanup section). The image's
# own default ACL on olcDatabase={1}mdb,cn=config restricts every non-admin
# principal to reading only its own entry ("by self read ... by * none"),
# which breaks LDAP search for any bind/search account (mds) that needs to
# look up OTHER entries — the entire point of CFK's provider.ldap/
# identityProvider.ldap. This replaces that one rule with a broader read
# grant scoped to this directory's own tree; rules {0} (local-socket admin
# bypass) and {1} (userPassword protection) are reproduced unchanged from the
# image default, confirmed via a live `ldapsearch -Y EXTERNAL -H ldapi:///`
# query against olcDatabase={1}mdb,cn=config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-acl-bootstrap
  namespace: openldap
data:
  01-acl.ldif: |
    dn: olcDatabase={1}mdb,cn=config
    changetype: modify
    replace: olcAccess
    olcAccess: {0}to * by dn.exact="gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth" manage by * break
    olcAccess: {1}to attrs=userPassword,shadowLastChange by self write by dn="cn=admin,dc=confluentdemo,dc=local" write by anonymous auth by * none
    olcAccess: {2}to * by dn.subtree="dc=confluentdemo,dc=local" read by dn="cn=admin,dc=confluentdemo,dc=local" write by * none
