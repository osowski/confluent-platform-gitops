---
# Dedicated MDS LDAP bind credential (uid=mds,ou=services,...). Bind + search
# ACLs only, per CFK's documented rotation guidance: never reuse this
# principal for anything else, and rotate by swapping to a standby user
# rather than editing this Secret's content in place
# (docs-operator co-manage-authentication.rst, "Update MDS user").
#
# Key name (ldap.txt, "username=<bindDn>\npassword=<bindPassword>") matches
# the format CFK's services.mds.provider.ldap.authentication.simple.secretRef
# expects.
apiVersion: v1
kind: Secret
metadata:
  name: mds-ldap-credential
  namespace: openldap
  annotations:
    # Kafka's MDS provider config lives in the `kafka` namespace; mirror this
    # bind credential there so the Kafka CR can reference it.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kafka"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
stringData:
  ldap.txt: |
    username=uid=mds,ou=services,dc=confluentdemo,dc=local
    password=mds-bind-password
