---
# CMF credential chain for the secure-sql Flink SQL tenant.
#
# TWO DISTINCT SECRET KINDS, TWO DISTINCT PURPOSES (see design spec
# "FlinkSecret (CMF-side, paths only)" section):
#   * secure-sql-mtls-client (cert-manager Secret, created in Task 2.5) holds
#     the actual mTLS credential (tls.crt/tls.key/ca.crt) and is mounted
#     directly into the FlinkComputePool pod template (Task 4) and, via
#     Reflector, into cmf-operator's pod (Task 2.5).
#   * secure-sql-cmf-kafka-credentials (this Secret) holds only the file
#     paths those mounted files resolve to inside each pod, plus the
#     security.protocol connection property. No certificate or private-key
#     byte ever appears here. Both cmf-app (compile time) and the compute
#     pool (runtime) read the SAME paths - /etc/flink/secrets/kafka/*.pem -
#     which is exactly why Task 2.5's cmf-operator init container writes
#     to that identical path.
#
# NAMING IS CRITICAL (ADR-0010): FlinkSecret.metadata.name must exactly
# match the FlinkEnvironmentSecretMapping.metadata.name and the
# connectionSecretRef/connectionSecretId that references them.
#
# Apply order: Secret (10) -> FlinkSecret (20) ->
# FlinkEnvironmentSecretMapping (30) -> catalog (40) -> database (50).
apiVersion: v1
kind: Secret
metadata:
  name: secure-sql-cmf-kafka-credentials
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  security.protocol: "SSL"
  ssl.keystore.type: "PEM"
  ssl.keystore.location: "/etc/flink/secrets/kafka/keystore.pem"
  ssl.truststore.type: "PEM"
  ssl.truststore.location: "/etc/flink/secrets/kafka/truststore.pem"
---
# Reuses the cmf identity (not a new sa-secure-sql-flink SA) for Schema
# Registry auth. A per-tenant SA like shapes/colors' sa-<group>-flink would
# need Keycloak provisioning via keycloak-service-account-job.yaml, which
# only ever creates 4 hardcoded clients and hard-fails without a
# pre-existing Keycloak group - and this design deliberately has no
# secure-sql group (see design spec's RBAC section). cmf is already a live
# Keycloak client (used by CMFRestClass's own OAuth flow, see
# cmfrestclass-oauth-patch.yaml) and already holds cmf-subjects-owner
# (ResourceOwner on all Subjects), matching the pattern
# flink-resources/components/oauth/flink-secret-default.yaml uses for the
# generic `default` environment.
apiVersion: v1
kind: Secret
metadata:
  name: secure-sql-cmf-sr-credentials
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "10"
type: Opaque
stringData:
  bearer.auth.credentials.source: "OAUTHBEARER"
  bearer.auth.client.id: "cmf"
  bearer.auth.client.secret: "cmf-secret"
  bearer.auth.scope: "profile email"
  bearer.auth.issuer.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
  bearer.auth.token.endpoint.url: "http://keycloak.keycloak.svc.cluster.local:8080/realms/confluent/protocol/openid-connect/token"
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: kafka-conn-secret-id-secure-sql
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: secure-sql-cmf-kafka-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkSecret
metadata:
  name: sr-conn-secret-id-secure-sql
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  secretRef: secure-sql-cmf-sr-credentials
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: kafka-conn-secret-id-secure-sql
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: secure-sql-env
  secretRef:
    name: kafka-conn-secret-id-secure-sql
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
---
apiVersion: platform.confluent.io/v1beta1
kind: FlinkEnvironmentSecretMapping
metadata:
  name: sr-conn-secret-id-secure-sql
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  flinkEnvironment: secure-sql-env
  secretRef:
    name: sr-conn-secret-id-secure-sql
  cmfRestClassRef:
    name: cmf-rest-class
    namespace: flink
