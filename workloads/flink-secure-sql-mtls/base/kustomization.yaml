apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # flink-secure-sql namespace is owned by workloads/namespaces (wave 100)
  # - not declared here. The secure-sql-mtls-client Certificate lives in
  # its own workloads/flink-secure-sql-mtls-pki/ Application directory
  # (Task 2.5), synced far earlier (wave 108) than this tenant's own
  # Application (wave 121) - it is not part of this directory at all.
  - topics.yaml
  - schemas.yaml

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/part-of: flink-secure-sql-mtls
    app.kubernetes.io/managed-by: argocd
