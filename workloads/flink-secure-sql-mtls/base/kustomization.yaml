apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # flink-secure-sql namespace is owned by workloads/namespaces (wave 100)
  # - not declared here.
  #
  # mtls-certificate.yaml lives in this directory but is wired in through
  # ../pki-overlays/flink-demo-rbac-mtls (Task 2.5), not here - it must
  # sync in its own, much earlier Application (wave 108) so cmf-operator
  # (wave 118) can consume it. Listing it in both places would make two
  # Applications fight over ownership of the same resource.
  - topics.yaml
  - schemas.yaml

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/part-of: flink-secure-sql-mtls
    app.kubernetes.io/managed-by: argocd
