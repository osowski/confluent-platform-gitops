---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: secure-sql-input
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 3
  partitionCount: 3
  configs:
    cleanup.policy: "delete"
    retention.ms: "172800000"  # 2 days
  kafkaRestClassRef:
    name: default
    namespace: kafka
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: secure-sql-output
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 3
  partitionCount: 3
  configs:
    cleanup.policy: "delete"
    retention.ms: "172800000"  # 2 days
  kafkaRestClassRef:
    name: default
    namespace: kafka
