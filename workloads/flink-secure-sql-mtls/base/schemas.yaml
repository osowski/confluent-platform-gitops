---
apiVersion: platform.confluent.io/v1beta1
kind: Schema
metadata:
  name: secure-sql-input-value
  namespace: flink-secure-sql
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  schemaRegistryClusterRef:
    name: schemaregistry
    namespace: kafka
  data:
    configRef: secure-sql-input-value-avro-schema
    format: avro
  compatibilityLevel: BACKWARD
