---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-sql-input-value-avro-schema
  namespace: flink-secure-sql
data:
  schema: |
    {
    "type": "record",
    "name": "SecureSqlEvent",
    "namespace": "com.example.avro",
    "fields": [
      {
        "name": "id",
        "type": "string",
        "doc": "Unique identifier for the event"
      },
      {
        "name": "message",
        "type": "string",
        "doc": "Event payload"
      },
      {
        "name": "event_time",
        "type": {
          "type": "long",
          "logicalType": "timestamp-millis"
        },
        "doc": "Timestamp of the event in milliseconds since the epoch"
      }
    ]
    }
---
