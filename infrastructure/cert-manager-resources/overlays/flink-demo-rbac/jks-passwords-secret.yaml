---
# Passwords for the JKS keystore/truststore produced by cmf-server-cert.yaml.
# cert-manager v1.19.2's `keystores.jks` stanza takes a single
# passwordSecretRef and uses it to encrypt BOTH keystore.jks and (when the
# issuer supplies a CA cert, as ours does) truststore.jks - there is no
# separate truststore password field on the Certificate resource. Both keys
# below therefore carry the same value; keep them equal if either is rotated.
apiVersion: v1
kind: Secret
metadata:
  name: cfk-cmf-jks-passwords
  namespace: operator
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  keystore-password: "d0c9VjN4akwG4YHw0umZPoYfOIGALGdB"
  truststore-password: "d0c9VjN4akwG4YHw0umZPoYfOIGALGdB"
