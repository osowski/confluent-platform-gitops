---
# The RustFS image runs as UID/GID 10001, but a gp3 EBS volume mounts as a
# root-owned ext4 filesystem. fsGroup makes kubelet hand the volume to the
# RustFS group so the server can write /data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: storage
spec:
  template:
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
