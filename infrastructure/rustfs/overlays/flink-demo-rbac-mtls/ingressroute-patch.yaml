---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs
  namespace: storage
spec:
  routes:
    - match: Host(`s3.flink-demo-rbac-mtls.confluentdemo.local`)
      kind: Rule
      services:
        - name: rustfs
          port: 9000
          scheme: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-console
  namespace: storage
spec:
  routes:
    - match: Host(`s3-console.flink-demo-rbac-mtls.confluentdemo.local`)
      kind: Rule
      services:
        - name: rustfs
          port: 9001
          scheme: http
