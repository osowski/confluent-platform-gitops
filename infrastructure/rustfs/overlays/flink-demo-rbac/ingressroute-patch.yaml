---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs
  namespace: storage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3.flink-demo-rbac.confluentdemo.local`)
      kind: Rule
      services:
        - name: rustfs
          port: 9000
          scheme: http
  tls:
    secretName: rustfs-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-console
  namespace: storage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3-console.flink-demo-rbac.confluentdemo.local`)
      kind: Rule
      services:
        - name: rustfs
          port: 9001
          scheme: http
  tls:
    secretName: rustfs-tls
